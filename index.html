<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIGAette Mongolia Heating Simulator / 몽골 난방 사업성 시뮬레이터</title>
<!-- 모델 SSoT: build_model.py / heating_business_model_v1.xlsx v1.3 -->
<!-- 오프라인 사용 시: CDN 두 줄을 같은 폴더에 다운로드 후 src 경로 변경 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1e2530;
    --muted: #6b7785;
    --border: #e3e6ea;
    --accent: #2156a5;
    --accent-soft: #e8f0fb;
    --good: #2e8540;
    --bad: #c0392b;
    --warn: #b07b00;
    /* Okabe-Ito palette */
    --c-coal: #d55e00;
    --c-isotes: #0072b2;
    --c-pv:    #e6c200;
    --c-etc:   #009e73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
  }
  [x-cloak] { display: none !important; }
  header.app {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header.app h1 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.2; }
  header.app h1 .sub { font-size: 11px; color: var(--muted); font-weight: 500; display: block; }
  header.app .badge {
    font-size: 11px; padding: 2px 6px;
    background: var(--accent-soft); color: var(--accent); border-radius: 4px;
  }
  header.app .spacer { flex: 1; }
  header.app .toggle-group { display: flex; gap: 4px; }
  header.app .toggle-group button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    font-size: 11px;
  }
  header.app .toggle-group button.on {
    background: var(--accent); color: white; border-color: var(--accent);
  }
  header.app .action-btn {
    padding: 4px 12px;
    background: var(--accent); color: white;
    border: none; cursor: pointer; border-radius: 4px;
    font-size: 11px;
  }
  header.app .action-btn.secondary { background: var(--muted); }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr 250px;
    gap: 12px;
    padding: 12px;
    min-height: calc(100vh - 90px);
  }
  @media (max-width: 1200px) {
    .layout { grid-template-columns: 300px 1fr; }
    .layout > .presets { grid-column: 1 / -1; order: 3; max-height: 240px; }
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
  aside.params, section.results, aside.presets {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }
  aside.params { max-height: calc(100vh - 110px); overflow-y: auto; }
  aside.presets { max-height: calc(100vh - 110px); overflow-y: auto; }
  .group-title {
    font-weight: 700;
    font-size: 11px;
    color: var(--muted);
    margin: 12px 0 6px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .group-title:first-child { margin-top: 0; }
  details { margin-bottom: 8px; }
  details > summary { cursor: pointer; outline: none; user-select: none; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '▸ '; color: var(--muted); }
  details[open] summary::before { content: '▾ '; }
  .slider-row {
    display: grid;
    grid-template-columns: 1fr 64px;
    gap: 6px;
    align-items: center;
    padding: 4px 0;
  }
  .slider-row label {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; gap: 6px;
    font-size: 11px;
    color: var(--ink);
    font-weight: 500;
  }
  .slider-row label .unit { color: var(--muted); font-weight: normal; }
  .slider-row label .cell-ref { color: #a0a0a0; font-size: 9px; font-weight: normal; }
  .slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider-row input[type=number] {
    width: 64px;
    padding: 2px 4px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 3px;
    text-align: right;
  }
  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0;
    font-size: 11px;
    font-weight: 500;
  }
  .toggle-row input[type=checkbox] { transform: scale(1.2); }

  .meta-bar {
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 6px 10px;
    margin-bottom: 10px;
    font-size: 11px;
    color: var(--accent);
    display: flex; flex-wrap: wrap; gap: 12px;
  }
  .meta-bar strong { color: var(--ink); }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .kpi-tech-bar {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; padding: 4px 0;
    flex-wrap: wrap;
  }
  .kpi-tech-bar .label {
    font-size: 11px; color: var(--muted); font-weight: 500;
  }
  .kpi-tech-bar .toggle-group { display: flex; gap: 4px; }
  .kpi-tech-bar .toggle-group button {
    padding: 3px 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    font-size: 11px;
    border-radius: 3px;
  }
  .kpi-tech-bar .toggle-group button.on {
    background: var(--accent); color: white; border-color: var(--accent);
  }
  .kpi {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--c-isotes);
    border-radius: 5px;
    padding: 10px;
    transition: border-left-color 0.15s;
  }
  .kpi-grid.tech-pv .kpi { border-left-color: var(--c-pv); }
  .kpi-grid.tech-etc .kpi { border-left-color: var(--c-etc); }
  .kpi .kpi-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .kpi .kpi-value { font-size: 18px; font-weight: 700; color: var(--ink); }
  .kpi .kpi-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .kpi.good .kpi-value { color: var(--good); }
  .kpi.bad .kpi-value { color: var(--bad); }

  .results-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .results-table th, .results-table td {
    padding: 5px 8px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  .results-table th:first-child, .results-table td:first-child {
    text-align: left; color: var(--muted); font-weight: 500;
  }
  .results-table thead th {
    background: var(--bg);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--muted);
  }
  .results-table thead th.coal { color: var(--c-coal); }
  .results-table thead th.isotes { color: var(--c-isotes); }
  .results-table thead th.pv { color: #b0a020; }
  .results-table thead th.etc { color: var(--c-etc); }
  .results-table .pos { color: var(--good); }
  .results-table .neg { color: var(--bad); }
  .results-table strong { color: var(--ink); }

  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px;
  }
  .chart-card h3 {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .chart-canvas-wrap { position: relative; height: 220px; }

  .preset-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 8px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .preset-item:hover { background: var(--accent-soft); border-color: var(--accent); }
  .preset-item .preset-name { font-weight: 600; display: block; }
  .preset-item .preset-desc { font-size: 10px; color: var(--muted); }
  .preset-item.active { background: var(--accent); color: white; }
  .preset-item.active .preset-desc { color: #d4e3f7; }

  footer.app {
    padding: 8px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer.app code { background: var(--bg); padding: 0 4px; border-radius: 2px; }
  footer.app a { color: var(--accent); }

  .verify-banner {
    background: var(--warn);
    color: white;
    padding: 8px 16px;
    text-align: center;
    font-size: 12px;
  }
  .verify-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 11px;
  }
  .verify-table th, .verify-table td {
    padding: 4px 8px;
    border: 1px solid var(--border);
    text-align: right;
  }
  .verify-table th:first-child, .verify-table td:first-child { text-align: left; }
  .verify-table .pass { background: #e6f4ea; color: var(--good); font-weight: 600; }
  .verify-table .fail { background: #fce8e6; color: var(--bad); font-weight: 600; }

  /* Tutorial modal / 튜토리얼 모달 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 30, 50, 0.6);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--panel);
    border-radius: 8px;
    max-width: 900px;
    width: 100%;
    height: 720px;        /* 명시적 높이 — 본문(flex:1)이 펼쳐질 공간 확보 */
    max-height: 90vh;     /* 작은 화면에서는 viewport 90%로 제한 */
    display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .modal-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;   /* 헤더 압축 방지 */
  }
  .modal-header h2 { margin: 0; font-size: 16px; flex: 1; }
  .modal-header .modal-close {
    background: none; border: none; cursor: pointer; font-size: 20px;
    color: var(--muted); padding: 0 6px;
  }
  .modal-tabs {
    display: flex;
    flex-shrink: 0;       /* 본문이 길어도 탭 영역 압축 방지 */
    min-height: 42px;      /* 탭 최소 높이 보장 */
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .modal-tabs button {
    padding: 10px 14px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    line-height: 1.2;
    flex-shrink: 0;        /* 각 탭 버튼도 압축 방지 */
  }
  .modal-tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .modal-body {
    padding: 16px 24px;
    overflow-y: auto;
    flex: 1 1 0;
    min-height: 0;         /* flex 자식의 overflow가 정상 작동하도록 */
    font-size: 13px;
    line-height: 1.6;
  }
  .modal-body h3 { margin: 16px 0 8px; font-size: 14px; color: var(--accent); }
  .modal-body h3:first-child { margin-top: 0; }
  .modal-body ul, .modal-body ol { padding-left: 22px; margin: 6px 0; }
  .modal-body li { margin-bottom: 4px; }
  .modal-body kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: monospace;
    font-size: 11px;
  }
  .modal-body .tip {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    margin: 10px 0;
    border-radius: 3px;
    font-size: 12px;
  }
  .modal-body .warn {
    background: #fff8e6;
    border-left: 3px solid var(--warn);
    padding: 8px 12px;
    margin: 10px 0;
    border-radius: 3px;
    font-size: 12px;
  }
  .modal-body table {
    width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px;
  }
  .modal-body table th, .modal-body table td {
    padding: 5px 8px; border: 1px solid var(--border); text-align: left;
  }
  .modal-body table th { background: var(--bg); }
  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: space-between; align-items: center;
    flex-shrink: 0;        /* 푸터 (이전/다음 버튼) 압축 방지 */
  }
  .modal-footer .skip-check { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .modal-footer .btn-group { display: flex; gap: 8px; }
  .modal-footer button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
  }
  .modal-footer button.primary {
    background: var(--accent); color: white; border-color: var(--accent);
  }

  /* Cost editor specific / 비용 편집 모달 전용 */
  .cost-item {
    border: 1px solid var(--border);
    border-radius: 5px;
    margin-bottom: 12px;
    background: var(--panel);
  }
  .cost-item.active { border-color: var(--accent); }
  .cost-item-header {
    padding: 10px 12px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .cost-item-header.collapsed { border-bottom: none; }
  .cost-item-title {
    font-weight: 600;
    font-size: 13px;
  }
  .cost-item-title .unit-hint {
    color: var(--muted); font-weight: normal; font-size: 11px; margin-left: 6px;
  }
  .cost-item-status {
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
  }
  .cost-item-status.on { background: #e6f4ea; color: var(--good); }
  .cost-item-status.off { background: var(--bg); color: var(--muted); }
  .cost-item-actions { display: flex; gap: 6px; }
  .cost-item-actions button {
    padding: 3px 10px; font-size: 11px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); border-radius: 3px;
  }
  .cost-item-actions button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .cost-item-actions button.danger { background: #fce8e6; color: var(--bad); border-color: #f5b7b1; }
  .cost-item-body { padding: 8px 12px; }
  .cost-subitem {
    display: grid;
    grid-template-columns: minmax(180px, 2fr) minmax(160px, 1.5fr) auto;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 12px;
    align-items: start;
  }
  .cost-subitem:last-child { border-bottom: none; }
  .cost-subitem .name-cell {
    display: flex; flex-direction: column; gap: 3px;
  }
  .cost-subitem .name-cell input[type=text] {
    padding: 3px 6px; font-size: 11px;
    border: 1px solid var(--border); border-radius: 3px;
    width: 100%;
  }
  .cost-subitem .value-cell {
    display: flex; gap: 4px; align-items: center;
  }
  .cost-subitem .value-input {
    flex: 1; min-width: 0;
    padding: 4px 6px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 3px;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .cost-subitem .unit-select {
    padding: 4px 6px; font-size: 11px;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--panel); cursor: pointer;
    flex-shrink: 0;
  }
  .cost-subitem .formula-result {
    flex: 1; text-align: right;
    font-weight: 600; color: var(--accent);
    font-variant-numeric: tabular-nums;
    padding: 4px 6px;
  }
  .cost-subitem .action-cell {
    display: flex; gap: 4px; align-items: center;
    flex-shrink: 0;
  }
  .cost-subitem .mode-btn {
    padding: 3px 8px; font-size: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); border-radius: 3px;
    white-space: nowrap;
  }
  .cost-subitem .mode-btn.active {
    background: var(--accent-soft); color: var(--accent); border-color: var(--accent);
  }
  .cost-subitem .remove-btn {
    padding: 3px 9px; font-size: 13px; cursor: pointer;
    border: 1px solid #f5b7b1; background: #fce8e6; color: var(--bad);
    border-radius: 3px; line-height: 1;
  }
  .cost-subitem .formula-row {
    grid-column: 1 / -1;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 6px 8px;
    margin-top: 4px;
    font-size: 11px; color: var(--muted);
    background: var(--bg); border-radius: 3px;
  }
  .cost-subitem .formula-row .formula-input {
    width: 90px;
    padding: 3px 5px; font-size: 11px;
    border: 1px solid var(--border); border-radius: 3px;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .cost-subitem .formula-row .qty-input {
    width: 75px;
    padding: 3px 5px; font-size: 11px;
    border: 1px solid var(--border); border-radius: 3px;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .cost-subitem .formula-row .unit-label-input {
    width: 70px;
    padding: 3px 5px; font-size: 11px;
    border: 1px solid var(--border); border-radius: 3px;
  }
  .cost-subitem .formula-row .unit-select-sm {
    padding: 3px 4px; font-size: 10px;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--panel); cursor: pointer;
  }
  @media (max-width: 700px) {
    .cost-subitem { grid-template-columns: 1fr; }
    .cost-subitem .action-cell { justify-content: flex-end; }
  }
  .cost-add-btn {
    width: 100%; padding: 6px; margin-top: 6px;
    border: 1px dashed var(--border); background: var(--bg);
    cursor: pointer; font-size: 11px; color: var(--muted); border-radius: 3px;
  }
  .cost-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cost-sum-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; margin-top: 6px;
    background: var(--accent-soft); border-radius: 3px;
    font-size: 12px;
  }
  .cost-sum-bar .sum-label { color: var(--muted); }
  .cost-sum-bar .sum-value { font-weight: 700; color: var(--accent); }
  .cost-managed-pill {
    display: inline-block;
    padding: 1px 6px;
    font-size: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 8px;
    margin-left: 4px;
    cursor: pointer;
  }
  .cost-managed-pill:hover { background: var(--accent); color: white; }

  @media print {
    body { background: white; }
    header.app .toggle-group, header.app .action-btn,
    aside.params, aside.presets, footer.app, .modal-overlay { display: none !important; }
    .layout { grid-template-columns: 1fr; padding: 0; min-height: auto; }
    section.results { border: none; padding: 0; }
    .kpi, .chart-card { break-inside: avoid; page-break-inside: avoid; }
    .chart-canvas-wrap { height: 180px; }
  }
</style>
</head>
<body>

<div x-data="simulator()" x-init="init()" x-cloak>

  <!-- ============ Header / 헤더 ============ -->
  <header class="app">
    <h1>
      <span x-text="t('title')"></span>
      <span class="sub" x-text="t('subtitle')"></span>
    </h1>
    <span class="badge">v2.0 · Model v1.3</span>

    <div class="spacer"></div>

    <!-- Language toggle / 언어 토글 -->
    <div class="toggle-group">
      <button :class="{on: p.lang==='ko'}" @click="setLang('ko')">한국어</button>
      <button :class="{on: p.lang==='en'}" @click="setLang('en')">English</button>
    </div>

    <!-- Currency toggle / 통화 -->
    <div class="toggle-group">
      <button :class="{on: p.ccy==='USD'}" @click="p.ccy='USD'; recompute()">USD $</button>
      <button :class="{on: p.ccy==='MNT'}" @click="p.ccy='MNT'; recompute()">MNT ₮</button>
      <button :class="{on: p.ccy==='KRW'}" @click="p.ccy='KRW'; recompute()">KRW ₩</button>

              <span class="cell-ref" x-text="param(key).cell || ''"></span>

                   :min="param(key).min" :max="param(key).max" :step="param(key).step"

                   :min="param(key).min" :max="param(key).max" :step="param(key).step"

              <span x-text="paramLabel(key)"></span>

        <span x-text="t('lifetimeMeta') + ':'"></span><strong x-text="p.lifetime + (p.lang==='ko'?'년':' yr')"></strong>
        <span x-text="t('discount') + ':'"></span><strong x-text="(p.discount*100).toFixed(1) + '%'"></strong>

        <span class="label" x-text="t('kpiCompareLabel') + ':'"></span>

          <button :class="{on: p.kpiTech==='isotes'}" @click="p.kpiTech='isotes'" x-text="t('kpiTechIsotes')"></button>

          <div class="kpi-label" x-text="kpiTechName() + ' ' + t('kpiCapex')"></div>
          <div class="kpi-value" x-text="fmt(r.capex[p.kpiTech])"></div>
          <div class="kpi-sub" x-text="t('coalDiff') + ' +' + fmt(r.capex[p.kpiTech] - r.capex.coal)"></div>
        </div>
        <div class="kpi" :class="r.npv[p.kpiTech] >= 0 ? 'good' : 'bad'">
          <div class="kpi-label" x-text="kpiTechName() + ' ' + t('kpiNpv')"></div>
          <div class="kpi-value" x-text="fmtSigned(r.npv[p.kpiTech])"></div>
          <div class="kpi-sub" x-text="t('discountRef') + ' ' + (p.discount*100).toFixed(1) + '%'"></div>
        </div>
        <div class="kpi">
          <div class="kpi-label" x-text="kpiTechName() + ' ' + t('kpiLcoh')"></div>
          <div class="kpi-value" x-text="fmtPerMWh(r.lcoh[p.kpiTech])"></div>
          <div class="kpi-sub" x-text="t('coalLcohRef') + ' ' + fmtPerMWh(r.lcoh.coal)"></div>
        </div>
        <div class="kpi" :class="r.payback[p.kpiTech] < p.lifetime ? 'good' : 'bad'">
          <div class="kpi-label" x-text="kpiTechName() + ' ' + t('kpiPayback')"></div>
          <div class="kpi-value" x-text="fmtPayback(r.payback[p.kpiTech])"></div>
          <div class="kpi-sub" x-text="t('lifetimeRef') + ' ' + p.lifetime + (p.lang==='ko'?'년':' yr')"></div>
        </div>
      </div>

      <!-- 4-tech comparison table / 4기술 비교 표 -->
      <table class="results-table">
        <thead>
          <tr>
            <th x-text="t('metric')"></th>
            <th class="coal" x-text="t('coal')"></th>
            <th class="isotes" x-text="t('isotesGrid')"></th>
            <th class="pv" x-text="t('pvIsotes')"></th>
            <th class="etc" x-text="t('etcIsotes')"></th>
          </tr>
        </thead>
        <tbody>
          <tr><td x-text="t('rowCapex')"></td>
            <td x-text="fmt(r.capex.coal)"></td>
            <td x-text="fmt(r.capex.isotes)"></td>
            <td x-text="fmt(r.capex.pv)"></td>
            <td x-text="fmt(r.capex.etc)"></td></tr>
          <tr><td x-text="t('rowGross')"></td>
            <td x-text="fmt(r.gross.coal)"></td>
            <td x-text="fmt(r.gross.isotes)"></td>
            <td x-text="fmt(r.gross.pv)"></td>
            <td x-text="fmt(r.gross.etc)"></td></tr>
          <tr><td x-text="t('rowCredit')"></td>
            <td>—</td>
            <td x-text="fmt(r.credit.isotes)" :class="r.credit.isotes>0?'pos':''"></td>
            <td x-text="fmt(r.credit.pv)" :class="r.credit.pv>0?'pos':''"></td>
            <td x-text="fmt(r.credit.etc)" :class="r.credit.etc>0?'pos':''"></td></tr>
          <tr><td><strong x-text="t('rowNet')"></strong></td>
            <td x-text="fmt(r.net.coal)"></td>
            <td x-text="fmt(r.net.isotes)"></td>
            <td x-text="fmt(r.net.pv)"></td>
            <td x-text="fmt(r.net.etc)"></td></tr>
          <tr><td x-text="t('rowLcoh')"></td>
            <td x-text="fmtPerMWh(r.lcoh.coal)"></td>
            <td x-text="fmtPerMWh(r.lcoh.isotes)"></td>
            <td x-text="fmtPerMWh(r.lcoh.pv)"></td>
            <td x-text="fmtPerMWh(r.lcoh.etc)"></td></tr>
          <tr><td x-text="t('rowPayback')"></td>
            <td>—</td>
            <td x-text="fmtPayback(r.payback.isotes)"></td>
            <td x-text="fmtPayback(r.payback.pv)"></td>
            <td x-text="fmtPayback(r.payback.etc)"></td></tr>
          <tr><td><strong x-text="t('rowNpv')"></strong></td>
            <td>—</td>
            <td x-text="fmtSigned(r.npv.isotes)" :class="r.npv.isotes>0?'pos':'neg'"></td>
            <td x-text="fmtSigned(r.npv.pv)" :class="r.npv.pv>0?'pos':'neg'"></td>
            <td x-text="fmtSigned(r.npv.etc)" :class="r.npv.etc>0?'pos':'neg'"></td></tr>
          <tr><td x-text="t('rowCo2')"></td>
            <td>—</td>
            <td x-text="r.co2.isotes.toFixed(1)"></td>
            <td x-text="r.co2.pv.toFixed(1)"></td>
            <td x-text="r.co2.etc.toFixed(1)"></td></tr>
        </tbody>
      </table>

      <!-- Charts / 차트 -->
      <div class="chart-grid">
        <div class="chart-card">
          <h3 x-text="t('chartLcoh')"></h3>
          <div class="chart-canvas-wrap"><canvas id="lcohChart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3 x-text="t('chartNpv')"></h3>
          <div class="chart-canvas-wrap"><canvas id="npvChart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3 x-text="t('chartCost')"></h3>
          <div class="chart-canvas-wrap"><canvas id="costChart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3 x-text="t('chartCo2')"></h3>
          <div class="chart-canvas-wrap"><canvas id="co2Chart"></canvas></div>
        </div>
      </div>

      <!-- Verification results / 검증 결과 -->
      <template x-if="testMode">
        <div>
          <h3 style="margin-top: 20px;" x-text="t('verifyTitle')"></h3>
          <table class="verify-table">
            <thead><tr>
              <th x-text="t('verifyScenario')"></th>
              <th x-text="t('verifyMetric')"></th>
              <th x-text="t('verifyExpected')"></th>
              <th x-text="t('verifyActual')"></th>
              <th x-text="t('verifyError')"></th>
              <th x-text="t('verifyVerdict')"></th>
            </tr></thead>
            <tbody>
              <template x-for="row in testResults" :key="row.id">
                <tr :class="row.pass ? 'pass' : 'fail'">
                  <td x-text="row.scenario"></td>
                  <td x-text="row.metric"></td>
                  <td x-text="row.expected.toFixed(2)"></td>
                  <td x-text="row.actual.toFixed(2)"></td>
                  <td x-text="row.error.toFixed(2)+'%'"></td>
                  <td x-text="row.pass ? '✓ PASS' : '✗ FAIL'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </section>

    <!-- ============ Right: Presets / 우: 프리셋 ============ -->
    <aside class="presets">
      <div class="group-title"><span x-text="t('presets')"></span></div>
      <template x-for="(preset, idx) in presets" :key="idx">
        <button class="preset-item"
                :class="{active: activePreset === idx}"
                @click="applyPreset(idx)">
          <span class="preset-name" x-text="preset.icon + ' ' + presetName(preset)"></span>
          <span class="preset-desc" x-text="presetDesc(preset)"></span>
        </button>
      </template>
    </aside>

  <footer class="app">
    <span><span x-text="t('footerSsot')"></span> <code>heating_business_model_v1.xlsx v1.3</code> <span x-text="t('footerSsotSuffix')"></span></span>
    <span><span x-text="t('footerVerify')"></span> <a :href="testMode ? '?' : '?test=1'" x-text="testMode ? t('normalModeLink') : t('verifyModeLink')"></a></span>
    <span><span x-text="t('footerBuild')"></span> 2026-05-11</span>
  </footer>

  <!-- Cost editor modal / 비용 편집 모달 -->
  <template x-if="costEditorOpen">
    <div class="modal-overlay" @click.self="closeCostEditor()">
      <div class="modal">
        <div class="modal-header">
          <h2 x-text="'🛠️ ' + t('costEditorTitle')"></h2>
          <button class="modal-close" @click="closeCostEditor()">✕</button>
        </div>
        <div class="modal-tabs">
          <button :class="{active: costEditorTab === 'common'}"  @click="costEditorTab = 'common'"  x-text="t('costTabCommon')"></button>
          <button :class="{active: costEditorTab === 'isotes'}"  @click="costEditorTab = 'isotes'"  x-text="t('costTabIsotes')"></button>
          <button :class="{active: costEditorTab === 'pv'}"      @click="costEditorTab = 'pv'"      x-text="t('costTabPv')"></button>
          <button :class="{active: costEditorTab === 'etc'}"     @click="costEditorTab = 'etc'"     x-text="t('costTabEtc')"></button>
          <button :class="{active: costEditorTab === 'opex'}"    @click="costEditorTab = 'opex'"    x-text="t('costTabOpex')"></button>
          <button :class="{active: costEditorTab === 'tornado'}" @click="costEditorTab = 'tornado'; renderTornado()" x-text="t('costTabTornado')"></button>
        </div>
        <div class="modal-body">
          <!-- 토네이도 탭 (특수 케이스) -->
          <template x-if="costEditorTab === 'tornado'">
            <div>
              <p style="font-size: 12px; color: var(--muted); margin-bottom: 10px;" x-text="t('costTornadoDesc')"></p>
              <template x-if="computeTornado().length === 0">
                <div style="padding: 24px; text-align: center; color: var(--muted); background: var(--bg); border-radius: 4px;"
                     x-text="t('costTornadoNoData')"></div>
              </template>
              <template x-if="computeTornado().length > 0">
                <div style="position: relative; height: 480px;">
                  <canvas id="tornadoChart"></canvas>
                </div>
              </template>
            </div>
          </template>

          <!-- 일반 탭들 (분해 편집) -->
          <template x-if="costEditorTab !== 'tornado'">
            <div>
          <!-- 사용자 정의 부모 항목 추가 폼 -->
          <div style="margin-bottom: 12px; padding: 8px 10px; background: var(--bg); border-radius: 4px;">
            <template x-if="!customParentForm._open">
              <button class="cost-add-btn" @click="openCustomForm()"
                      x-text="(p.lang==='en' ? '+ Add custom parent item to this tab' : '+ 이 탭에 사용자 정의 부모 항목 추가')"></button>
            </template>
            <template x-if="customParentForm._open">
              <div style="display: grid; gap: 6px; padding: 6px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                  <input type="text" x-model="customParentForm.name_ko"
                         placeholder="이름 (KO)" style="padding: 4px 6px; font-size: 12px; border: 1px solid var(--border); border-radius: 3px;">
                  <input type="text" x-model="customParentForm.name_en"
                         placeholder="Name (EN)" style="padding: 4px 6px; font-size: 12px; border: 1px solid var(--border); border-radius: 3px;">
                </div>
                <select x-model="customParentForm.applyTo" @change="onCustomApplyToChange()"
                        style="padding: 4px 6px; font-size: 12px; border: 1px solid var(--border); border-radius: 3px;">
                  <template x-for="opt in customApplyToOptions(costEditorTab)" :key="opt.applyTo">
                    <option :value="opt.applyTo" x-text="opt['label_' + (p.lang||'ko')]"></option>
                  </template>
                </select>
                <div style="display: flex; gap: 6px;">
                  <button class="primary" @click="addCustomParent()"
                          style="flex: 1; padding: 6px; font-size: 12px; border: 1px solid var(--accent); background: var(--accent); color: white; border-radius: 3px; cursor: pointer;"
                          x-text="p.lang==='en' ? 'Create' : '생성'"></button>
                  <button @click="customParentForm._open = false"
                          style="padding: 6px 12px; font-size: 12px; border: 1px solid var(--border); background: var(--panel); border-radius: 3px; cursor: pointer;"
                          x-text="p.lang==='en' ? 'Cancel' : '취소'"></button>
                </div>
              </div>
            </template>
          </div>

          <template x-for="key in itemsForTab(costEditorTab)" :key="key">
            <div class="cost-item" :class="{active: breakdownActive(key)}">
              <div class="cost-item-header" :class="{collapsed: !breakdownActive(key)}">
                <div>
                  <template x-if="!isCustom(key)">
                    <span class="cost-item-title" x-text="bdParentLabel(key)"></span>
                  </template>
                  <template x-if="isCustom(key)">
                    <span class="cost-item-title" style="color: var(--accent);">
                      <span style="font-size: 9px; padding: 1px 4px; background: var(--accent); color: white; border-radius: 2px; margin-right: 4px;">custom</span>
                      <input type="text" :value="bdParentLabel(key)"
                             @input="breakdowns[key]['name_' + (p.lang||'ko')] = $event.target.value; updateCustomParentName(key)"
                             style="border: none; background: transparent; font-weight: 600; font-size: 13px; color: var(--accent); width: 180px;">
                    </span>
                  </template>
                  <span class="unit-hint" x-text="'(' + bdDef(key).parentUnit + ')'"></span>
                  <span class="cost-item-status" :class="breakdownActive(key) ? 'on' : 'off'"
                        x-text="breakdownActive(key) ? t('costBreakdownActive') : t('costNoBreakdown')"></span>
                </div>
                <div class="cost-item-actions">
                  <template x-if="!isCustom(key) && !breakdownActive(key)">
                    <button class="primary" @click="toggleBreakdown(key)" x-text="t('costEnableBreakdown')"></button>
                  </template>
                  <template x-if="!isCustom(key) && breakdownActive(key)">
                    <button @click="toggleBreakdown(key)" x-text="t('costDisableBreakdown')"></button>
                  </template>
                  <template x-if="!isCustom(key) && breakdowns[key]">
                    <button class="danger" @click="resetBreakdown(key)" x-text="t('costReset')"></button>
                  </template>
                  <template x-if="isCustom(key)">
                    <button class="danger" @click="removeCustomParent(key)"
                            x-text="p.lang==='en' ? 'Delete' : '삭제'"></button>
                  </template>
                </div>
              </div>
              <template x-if="breakdownActive(key)">
                <div class="cost-item-body">
                  <template x-for="(item, idx) in breakdowns[key].items" :key="idx">
                    <div class="cost-subitem">
                      <!-- 이름 셀: KO·EN 동시 편집 -->
                      <div class="name-cell">
                        <input type="text" x-model="item.name_ko" @input="onSubItemEdit()" placeholder="이름 (KO)">
                        <input type="text" x-model="item.name_en" @input="onSubItemEdit()" placeholder="Name (EN)">
                      </div>

                      <!-- 값 셀: 콤마 포맷 + 단위 셀렉터 (simple 모드) -->
                      <template x-if="item.mode === 'simple'">
                        <div class="value-cell">
                          <input type="text" class="value-input"
                                 :value="formatScaled(item.value, ensureUnit(item, bdDef(key).parentUnit))"
                                 @input="item.value = parseScaled($event.target.value, item.valueUnit || 1); onSubItemEdit()"
                                 @blur="$event.target.value = formatScaled(item.value, item.valueUnit || 1)">
                          <select class="unit-select" x-model.number="item.valueUnit" @change="onSubItemEdit()">
                            <template x-for="opt in unitOptions(bdDef(key).parentUnit)" :key="opt.scale">
                              <option :value="opt.scale" x-text="opt['label_' + (p.lang||'ko')]"></option>
                            </template>
                          </select>
                        </div>
                      </template>
                      <template x-if="item.mode === 'formula'">

// ============================================================
// Core computation / 핵심 계산
// ============================================================
// Effective-value helper: breakdown sum if active, else p[key]
function _itemValue(item) {
  return item.mode === 'formula'
    ? (item.unitCost || 0) * (item.quantity || 0)
    : (item.value || 0);
}
function effectiveValue(p, bd, key) {
  const b = bd && bd[key];
  if (b && b.enabled && b.items && b.items.length > 0) {
    return b.items.reduce((s, i) => s + _itemValue(i), 0);
  }
  return p[key];
}

// 사용자 정의 부모 항목의 applyTo별 합계 (lump-sum extras)
function customSum(bd, applyTo) {
  if (!bd) return 0;
  let s = 0;
  for (const key in bd) {
    const b = bd[key];
    if (b && b.custom && b.enabled && b.applyTo === applyTo && b.items) {
      s += b.items.reduce((acc, it) => acc + _itemValue(it), 0);
    }
  }
  return s;
}

function compute(p, bd) {
  const eff = (k) => effectiveValue(p, bd, k);
  const cx  = (a) => customSum(bd, a);
  const fx = p.ccy === 'USD' ? 1 : p.ccy === 'MNT' ? p.fx_usd_mnt : p.fx_usd_krw;
  const scale = p.mode === 'scale' ? (p.target_cap / 1.5) : 1.0;

  const annualMJ   = p.daily_mj * p.heating_days * scale;
  const annualMWh  = annualMJ / 3600;
  const elecKwhYr  = (p.daily_mj / 3.6) / p.elec_eff * p.heating_days * scale;
  const coalTonYr  = annualMJ / p.coal_eff / p.coal_hhv / 1000;

  const coalLow_mnt  = eff('coal_low_mnt')  * p.coal_price_mult;
  const coalHigh_mnt = eff('coal_high_mnt') * p.coal_price_mult;
  const coalFuelUsd  = coalTonYr * (coalLow_mnt + coalHigh_mnt) / 2 / p.fx_usd_mnt;
  const transportUsd = eff('transport_usd') * p.trips_yr * scale;
  const coalMaintUsd = eff('coal_only') * eff('opex_pct_coal') * scale;
  // 사용자 정의 부모 항목: 운영비 lump-sum 추가
  const coalAnnUsd   = coalFuelUsd + transportUsd + coalMaintUsd + cx('coal_opex');

  // CAPEX: 사용자 정의 부모 항목 추가 (각각 적절한 단위)
  const capexCoalUsd = (eff('common_infra') + eff('coal_only') + cx('coal_capex_addon')) * Math.pow(scale, p.scale_exp);
  const capexIsotesBaseUsd = (eff('capex_system_krw') + eff('capex_logistics_krw') + eff('capex_install_krw') + cx('isotes_capex_krw')) / p.fx_usd_krw;
  const capexIsotesUsd = capexIsotesBaseUsd * Math.pow(scale, p.scale_exp);

  const pvKwp = (p.daily_mj / 3.6) / p.elec_eff / p.solar_irrad * scale;
  const capexPvAddUsd = pvKwp * 1000 * (eff('pv_module') + eff('pv_inverter') + eff('pv_install')) + cx('pv_capex_addon');
  const capexPvUsd = capexIsotesUsd + capexPvAddUsd;

  const etcM2 = (p.daily_mj / 3.6) / p.elec_eff / p.solar_irrad / p.etc_eff * scale;
  const capexEtcAddUsd = etcM2 * (eff('etc_tube') + eff('etc_mount') + eff('etc_circuit')) + cx('etc_capex_addon');
  const capexEtcUsd = capexIsotesUsd + capexEtcAddUsd;

  const elecRateDisc = eff('night_rate_mnt') * (1 - p.night_disc) / p.fx_usd_mnt;
  const elecRateFull = eff('night_rate_mnt') / p.fx_usd_mnt;
  const isotesAnnUsd = elecKwhYr * elecRateDisc + capexIsotesUsd * eff('opex_pct_isotes') + cx('isotes_opex');
  const pvAnnUsd  = elecKwhYr * (1 - p.pv_cover)  * elecRateFull + capexPvUsd  * eff('opex_pct_pv')  + cx('pv_opex');
  const etcAnnUsd = elecKwhYr * (1 - p.etc_cover) * elecRateFull + capexEtcUsd * eff('opex_pct_etc') + cx('etc_opex');

  const coalCo2 = coalTonYr * 2.36;
  const gridCo2 = elecKwhYr * p.grid_co2 / 1000;
  const co2Isotes = coalCo2 - gridCo2;
  const co2Pv     = coalCo2 - (1 - p.pv_cover)  * gridCo2;
  const co2Etc    = coalCo2 - (1 - p.etc_cover) * gridCo2;

  const carbonMult = p.carbon_on ? p.carbon_price : 0;
  const creditIsotes = co2Isotes * carbonMult;
  const creditPv     = co2Pv     * carbonMult;
  const creditEtc    = co2Etc    * carbonMult;

  const netCoal   = coalAnnUsd;
  const netIsotes = isotesAnnUsd - creditIsotes;
  const netPv     = pvAnnUsd     - creditPv;
  const netEtc    = etcAnnUsd    - creditEtc;

  const r = p.discount, n = p.lifetime;
  const PVF = (1 - Math.pow(1 + r, -n)) / r;

  const lcoh = (cap, ann) => safeFinite((cap + PVF * ann) / (PVF * annualMWh) * fx);
  const payback = (capDiff, save) => save > 0 ? capDiff / save : Infinity;
  const npv = (capDiff, save) => save * PVF - capDiff;

  return {
    annualMWh, coalTonYr, elecKwhYr, pvKwp, etcM2,
    capex: { coal: capexCoalUsd*fx, isotes: capexIsotesUsd*fx, pv: capexPvUsd*fx, etc: capexEtcUsd*fx },
    gross: { coal: coalAnnUsd*fx, isotes: isotesAnnUsd*fx, pv: pvAnnUsd*fx, etc: etcAnnUsd*fx },
    credit: { coal: 0, isotes: creditIsotes*fx, pv: creditPv*fx, etc: creditEtc*fx },
    net:   { coal: netCoal*fx, isotes: netIsotes*fx, pv: netPv*fx, etc: netEtc*fx },
    lcoh:  { coal: lcoh(capexCoalUsd, netCoal), isotes: lcoh(capexIsotesUsd, netIsotes),
             pv: lcoh(capexPvUsd, netPv), etc: lcoh(capexEtcUsd, netEtc) },
    payback: { isotes: payback(capexIsotesUsd - capexCoalUsd, netCoal - netIsotes),
               pv:     payback(capexPvUsd     - capexCoalUsd, netCoal - netPv),
               etc:    payback(capexEtcUsd    - capexCoalUsd, netCoal - netEtc) },
    npv: { isotes: npv(capexIsotesUsd - capexCoalUsd, netCoal - netIsotes) * fx,
           pv:     npv(capexPvUsd     - capexCoalUsd, netCoal - netPv)     * fx,
           etc:    npv(capexEtcUsd    - capexCoalUsd, netCoal - netEtc)    * fx },
    co2: { coal: coalCo2, isotes: co2Isotes, pv: co2Pv, etc: co2Etc },
  };
}
function safeFinite(v) { return Number.isFinite(v) ? v : 0; }

// 헬퍼: parent 단위·값에 맞는 스마트 표시 단위 scale
function _smartScale(parentUnit, value) {
  const opts = UNIT_OPTIONS[parentUnit] || [{ scale: 1 }];
  if (!Number.isFinite(value) || value === 0) return opts[0].scale;
  const absV = Math.abs(value);
  let best = opts[0].scale;
  for (const opt of opts) {
    if (absV / opt.scale >= 1) best = opt.scale;
  }
  return best;
}

// Non-reactive chart storage (must NOT be inside Alpine data proxy —
// Chart.js 인스턴스를 Proxy로 감싸면 update('none')가 silent failure)
// ============================================================
const CHART_INSTANCES = {};

// ============================================================
// Alpine component
// ============================================================
function simulator() {
  return {
    p: {},
    r: { capex: {}, gross: {}, credit: {}, net: {}, lcoh: {}, payback: {}, npv: {}, co2: {} },
    breakdowns: {},       // 사용자 정의 분해 (localStorage 영속)
    tier1Keys: [], tier2Keys: [], tier3Keys: [],
    activePreset: 0,
    testMode: false,
    testResults: [],
    chartsReady: false,
    _debounce: null,
    _bdSaveDebounce: null,
    presets: PRESETS,
    breakdownDefs: BREAKDOWN_DEFS,
    costEditorOpen: false,
    costEditorTab: 'common',  // 'common' | 'isotes' | 'pv' | 'etc' | 'opex'
    tutorialOpen: false,
    tutorialTab: 0,
    tutorialSkip: false,
    tutorialTabs: [
      { key: 'tabQuick' },
      { key: 'tabMode' },
      { key: 'tabSlider' },
      { key: 'tabResults' },
      { key: 'tabCost' },
      { key: 'tabPresets' },
      { key: 'tabIO' },
      { key: 'tabFaq' },
    ],

    init() {
      for (const [k, def] of Object.entries(PARAM_DEFS)) this.p[k] = def.default;
      this.p.mode = 'poc';
      this.p.ccy = 'USD';
      this.p.lang = 'ko';
      this.p.carbon_on = false;
      this.p.kpiTech = 'isotes';   // KPI 카드 비교 대상: 'isotes' | 'pv' | 'etc'
      this.tier1Keys = Object.keys(PARAM_DEFS).filter(k => PARAM_DEFS[k].tier === 1);
      this.tier2Keys = Object.keys(PARAM_DEFS).filter(k => PARAM_DEFS[k].tier === 2);
      this.tier3Keys = Object.keys(PARAM_DEFS).filter(k => PARAM_DEFS[k].tier === 3);

      const url = new URL(window.location.href);
      this.testMode = url.searchParams.get('test') === '1';
      const langParam = url.searchParams.get('lang');
      if (langParam === 'en' || langParam === 'ko') {
        this.p.lang = langParam;
        document.documentElement.setAttribute('lang', langParam);
      }

      // localStorage에서 분해 정의 복원 (있으면)
      this.loadBreakdowns();

      // 초기 compute는 동기 실행 — 차트가 0으로 깜빡이는 것 방지
      this.r = compute(this.p, this.breakdowns);
      // Robust chart init: wait for x-cloak removal + first paint + Chart.js ready.
      // setTimeout(0) → next macrotask after Alpine processes x-cloak.
      // requestAnimationFrame → after browser paint (canvas dimensions ready).
      const tryInit = (attempt = 0) => {
        if (typeof Chart === 'undefined') {
          if (attempt < 50) return setTimeout(() => tryInit(attempt + 1), 100);
          console.error('[GIGAette] Chart.js failed to load after 5s');
          return;
        }
        const canvas = document.getElementById('lcohChart');
        if (!canvas || canvas.offsetWidth === 0) {
          if (attempt < 30) return requestAnimationFrame(() => tryInit(attempt + 1));
          console.warn('[GIGAette] Canvas size 0 after 30 RAFs — proceeding anyway');
        }
        this.initCharts();
      };
      setTimeout(() => tryInit(), 0);

      if (this.testMode) this.runVerification();

      // First-visit tutorial / 첫 방문 튜토리얼
      try {
        const seen = localStorage.getItem('gigaette_heatingsim_v2_tut_seen');
        if (!seen) this.openTutorial();
      } catch (e) { /* localStorage blocked (file://): silently skip */ }
    },

    // ===== Cost editor / 비용 편집기 =====
    openCostEditor() { this.costEditorOpen = true; },
    closeCostEditor() { this.costEditorOpen = false; },

    // 단위 옵션 + 스마트 기본값
    unitOptions(parentUnit) {
      return UNIT_OPTIONS[parentUnit] || [{ scale: 1, label_ko: parentUnit, label_en: parentUnit }];
    },
    smartDefaultUnit(parentUnit, value) {
      const opts = this.unitOptions(parentUnit);
      if (!Number.isFinite(value) || value === 0) return opts[0].scale;
      const absV = Math.abs(value);
      // displayed >= 1 인 가장 큰 scale 선택 (가독성↑)
      let best = opts[0].scale;
      for (const opt of opts) {
        if (absV / opt.scale >= 1) best = opt.scale;
      }
      return best;
    },
    // 3-digit comma 포맷
    formatNumber(v) {
      if (v === undefined || v === null || isNaN(v)) return '';
      const n = Number(v);
      if (n === 0) return '0';
      // 매우 작은 값(< 0.01)은 유효숫자 6자리, 큰 값은 소수점 6자리
      if (Math.abs(n) >= 1) {
        return n.toLocaleString(undefined, { maximumFractionDigits: 6 });
      }
      return n.toLocaleString(undefined, { maximumSignificantDigits: 6 });
    },
    parseNumber(s) {
      if (typeof s !== 'string') return Number(s) || 0;
      // 쉼표 제거 후 파싱. 빈 문자열·잘못된 입력은 0.
      const cleaned = s.replace(/,/g, '').trim();
      const n = parseFloat(cleaned);
      return Number.isFinite(n) ? n : 0;
    },
    // 단위 적용 표시·파싱 (저장은 parent 단위, 표시·입력은 사용자 scale)
    formatScaled(value, scale) {
      return this.formatNumber((value || 0) / (scale || 1));
    },
    parseScaled(s, scale) {
      return this.parseNumber(s) * (scale || 1);
    },
    // sub-item의 valueUnit 보장 (없으면 스마트 기본값 부여)
    ensureUnit(item, parentUnit) {
      if (!item.valueUnit) {
        const ref = item.mode === 'formula' ? ((item.unitCost || 0) * (item.quantity || 0)) : (item.value || 0);
        item.valueUnit = this.smartDefaultUnit(parentUnit, ref || 1);
      }
      return item.valueUnit;
    },

    breakdownActive(key) {
      const b = this.breakdowns[key];
      return !!(b && b.enabled && b.items && b.items.length > 0);
    },
    breakdownSum(key) {
      const b = this.breakdowns[key];
      if (!b || !b.items) return 0;
      return b.items.reduce((s, it) => s + (it.mode === 'formula'
        ? (it.unitCost || 0) * (it.quantity || 0)
        : (it.value || 0)), 0);
    },
    itemsForTab(tabId) {
      // 내장 항목 + 해당 탭의 커스텀 항목
      const builtin = Object.keys(BREAKDOWN_DEFS).filter(k => BREAKDOWN_DEFS[k].tab === tabId);
      const custom = Object.keys(this.breakdowns).filter(k =>
        k.startsWith('__custom_') && this.breakdowns[k].tab === tabId
      );
      return [...builtin, ...custom];
    },
    isCustom(key) { return key.startsWith('__custom_'); },
    bdDef(key) {
      if (this.isCustom(key)) {
        const b = this.breakdowns[key];
        return { tab: b.tab, parentUnit: b.unit, parentLabel_ko: b.name_ko, parentLabel_en: b.name_en };
      }
      return BREAKDOWN_DEFS[key];
    },
    bdParentLabel(key) {
      const def = this.bdDef(key);
      const lang = this.p.lang || 'ko';
      return def['parentLabel_' + lang] || def.parentLabel_ko;
    },

    // === 사용자 정의 부모 항목 ===
    customParentForm: { name_ko: '', name_en: '', applyTo: '', unit: '', _open: false },
    customApplyToOptions(tab) {
      // 탭별 가능한 applyTo (target) 옵션 + 권장 단위
      const all = {
        common: [
          { applyTo: 'coal_capex_addon', unit: 'USD', label_ko: '갈탄 CAPEX 추가 (USD)', label_en: 'Add to Coal CAPEX (USD)' },
        ],
        isotes: [
          { applyTo: 'isotes_capex_krw', unit: 'KRW', label_ko: 'IsoTES CAPEX 추가 (KRW)', label_en: 'Add to IsoTES CAPEX (KRW)' },
          { applyTo: 'isotes_opex', unit: 'USD/yr', label_ko: 'IsoTES 운영비 추가 (USD/yr)', label_en: 'Add to IsoTES OPEX (USD/yr)' },
        ],
        pv: [
          { applyTo: 'pv_capex_addon', unit: 'USD', label_ko: 'PV CAPEX 추가 (USD)', label_en: 'Add to PV CAPEX (USD)' },
          { applyTo: 'pv_opex', unit: 'USD/yr', label_ko: 'PV 운영비 추가 (USD/yr)', label_en: 'Add to PV OPEX (USD/yr)' },
        ],
        etc: [
          { applyTo: 'etc_capex_addon', unit: 'USD', label_ko: 'ETC CAPEX 추가 (USD)', label_en: 'Add to ETC CAPEX (USD)' },
          { applyTo: 'etc_opex', unit: 'USD/yr', label_ko: 'ETC 운영비 추가 (USD/yr)', label_en: 'Add to ETC OPEX (USD/yr)' },
        ],
        opex: [
          { applyTo: 'coal_opex', unit: 'USD/yr', label_ko: '갈탄 운영비 추가 (USD/yr)', label_en: 'Add to Coal OPEX (USD/yr)' },
          { applyTo: 'isotes_opex', unit: 'USD/yr', label_ko: 'IsoTES 운영비 추가 (USD/yr)', label_en: 'Add to IsoTES OPEX (USD/yr)' },
          { applyTo: 'pv_opex', unit: 'USD/yr', label_ko: 'PV 운영비 추가 (USD/yr)', label_en: 'Add to PV OPEX (USD/yr)' },
          { applyTo: 'etc_opex', unit: 'USD/yr', label_ko: 'ETC 운영비 추가 (USD/yr)', label_en: 'Add to ETC OPEX (USD/yr)' },
        ],
      };
      return all[tab] || [];

    openCustomForm() {
      const opts = this.customApplyToOptions(this.costEditorTab);
      this.customParentForm = {
        name_ko: '', name_en: '',
        applyTo: opts[0]?.applyTo || '',

        _open: true,

    bdItemName(item) {
      const lang = this.p.lang || 'ko';
      return item['name_' + lang] || item.name_ko || item.name_en || '';
    },

    enableBreakdown(key) {
      const def = BREAKDOWN_DEFS[key];
      if (!def) return;
      const parentVal = this.p[key];
      const n = def.suggestedItems.length;
      const each = parentVal / n;
      const smartScale = this.smartDefaultUnit(def.parentUnit, each);
      this.breakdowns[key] = {
        enabled: true,
        items: def.suggestedItems.map(s => ({
          name_ko: s.name_ko,
          name_en: s.name_en,
          mode: 'simple',
          value: each,
          valueUnit: smartScale,        // 표시 단위 (저장은 parent 단위)
          unitCost: 0,
          quantity: 0,
          unitLabel_ko: '',
          unitLabel_en: '',
        }))
      };
      this.saveBreakdowns();
      this.recompute();
    },
    disableBreakdown(key) {
      // 데이터는 유지 (다시 켜면 그대로). enabled만 false.
      if (this.breakdowns[key]) {
        this.breakdowns[key].enabled = false;
        this.saveBreakdowns();
        this.recompute();
      }
    },
    toggleBreakdown(key) {
      if (this.breakdownActive(key)) {
        this.disableBreakdown(key);
      } else if (this.breakdowns[key] && !this.breakdowns[key].enabled) {
        // 이전 분해 데이터가 있으면 재활성화만
        this.breakdowns[key].enabled = true;
        this.saveBreakdowns();
        this.recompute();
      } else {
        this.enableBreakdown(key);
      }
    },
    addSubItem(key) {
      const b = this.breakdowns[key];
      if (!b) return;
      // 직전 sub-item의 단위를 상속, 없으면 parent 단위 (scale=1)
      const def = this.bdDef(key);
      const inheritUnit = b.items.length > 0
        ? b.items[b.items.length - 1].valueUnit
        : this.unitOptions(def.parentUnit)[0].scale;
      b.items.push({
        name_ko: '신규 항목', name_en: 'New item',
        mode: 'simple', value: 0,
        valueUnit: inheritUnit,
        unitCost: 0, quantity: 0, unitLabel_ko: '', unitLabel_en: '',
      });
      this.saveBreakdowns();
      this.recompute();
    },
    removeSubItem(key, idx) {
      const b = this.breakdowns[key];
      if (!b || !b.items) return;
      b.items.splice(idx, 1);
      if (b.items.length === 0) {
        // 마지막 항목 삭제 시 분해 비활성화
        b.enabled = false;
      }
      this.saveBreakdowns();
      this.recompute();
    },
    toggleSubItemMode(key, idx) {
      const it = this.breakdowns[key].items[idx];
      if (it.mode === 'formula') {
        // formula → simple: 현재 계산된 값을 그대로 단순 값으로
        it.value = (it.unitCost || 0) * (it.quantity || 0);
        it.mode = 'simple';
      } else {
        // simple → formula: 기본 단가/수량 세팅 (1 × value)
        it.unitCost = it.value || 0;
        it.quantity = 1;
        it.unitLabel_ko = it.unitLabel_ko || '단위';
        it.unitLabel_en = it.unitLabel_en || 'unit';
        it.mode = 'formula';
      }
      this.saveBreakdowns();
      this.recompute();
    },
    onSubItemEdit() {
      // 모든 input edit 시 호출 (debounced save + recompute)
      this.saveBreakdowns();
      this.recompute();
    },
    resetBreakdown(key) {
      delete this.breakdowns[key];
      this.saveBreakdowns();
      this.recompute();
    },

    saveBreakdowns() {
      // localStorage 디바운스 저장
      if (this._bdSaveDebounce) clearTimeout(this._bdSaveDebounce);
      this._bdSaveDebounce = setTimeout(() => {
        try { localStorage.setItem('gigaette_heatingsim_v2_breakdowns', JSON.stringify(this.breakdowns)); } catch (e) {}
      }, 200);
    },
    loadBreakdowns() {
      try {
        const raw = localStorage.getItem('gigaette_heatingsim_v2_breakdowns');
        if (raw) this.breakdowns = JSON.parse(raw) || {};
      } catch (e) { this.breakdowns = {}; }
    },

    bdPresets: BREAKDOWN_PRESETS,
    tornadoChart: null,

    // 토네이도 데이터 계산: 활성 sub-item별 ±20% 변동 시 NPV 영향
    computeTornado() {
      const rows = [];
      // 기준: 스케일 100MWh, IsoTES+그리드, 기본 가정
      const baseP = { ...this.p, mode: 'scale', target_cap: 100 };
      const baseBd = JSON.parse(JSON.stringify(this.breakdowns));
      const baseR = compute(baseP, baseBd);
      const baseNpv = baseR.npv.isotes;

      const variance = 0.20; // ±20%

      for (const parentKey in this.breakdowns) {
        const b = this.breakdowns[parentKey];
        if (!b || !b.enabled || !b.items || b.items.length === 0) continue;
        const parentLabel = this.bdParentLabel(parentKey);

        for (let i = 0; i < b.items.length; i++) {
          const item = b.items[i];
          const itemName = this.bdItemName(item) || ('Item ' + (i + 1));
          const itemVal = item.mode === 'formula' ? (item.unitCost || 0) * (item.quantity || 0) : (item.value || 0);
          if (!itemVal) continue;

          // up: +20%, down: -20% (deep clone breakdowns and modify one item)
          const bdUp = JSON.parse(JSON.stringify(this.breakdowns));
          const bdDn = JSON.parse(JSON.stringify(this.breakdowns));
          if (item.mode === 'formula') {
            bdUp[parentKey].items[i].unitCost = (item.unitCost || 0) * (1 + variance);
            bdDn[parentKey].items[i].unitCost = (item.unitCost || 0) * (1 - variance);
          } else {
            bdUp[parentKey].items[i].value = itemVal * (1 + variance);
            bdDn[parentKey].items[i].value = itemVal * (1 - variance);
          }
          const npvUp = compute(baseP, bdUp).npv.isotes;
          const npvDn = compute(baseP, bdDn).npv.isotes;

          rows.push({
            label: parentLabel + ' → ' + itemName,
            low: npvDn - baseNpv,    // typically negative when item is a cost (lower cost → higher NPV)
            high: npvUp - baseNpv,    // typically negative effect (higher cost → lower NPV)
            range: Math.abs(npvUp - npvDn),
          });
        }
      }
      // sort by range desc
      rows.sort((a, b) => b.range - a.range);
      return rows.slice(0, 20);  // top 20 to keep readable
    },

    renderTornado() {
      this.$nextTick(() => {
        const canvas = document.getElementById('tornadoChart');
        if (!canvas) return;
        const data = this.computeTornado();
        if (this.tornadoChart) { try { this.tornadoChart.destroy(); } catch (e) {} this.tornadoChart = null; }
        if (data.length === 0) return;

        const labels = data.map(d => d.label);
        const lows  = data.map(d => d.low);
        const highs = data.map(d => d.high);

        this.tornadoChart = new Chart(canvas, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: '-20%', data: lows,  backgroundColor: '#0072b2' },
              { label: '+20%', data: highs, backgroundColor: '#d55e00' },
            ]
          },
          options: {
            indexAxis: 'y',
            responsive: true, maintainAspectRatio: false,
            animation: false,
            scales: {
              x: { stacked: false, title: { display: true, text: 'Δ NPV (USD)' }, ticks: { font: { size: 10 } } },
              y: { stacked: true, ticks: { font: { size: 10 }, autoSkip: false } }
            },
            plugins: { legend: { position: 'top', labels: { font: { size: 10 } } } }
          }
        });
      });
    },
    applyBreakdownPreset(presetId) {
      const preset = BREAKDOWN_PRESETS.find(p => p.id === presetId);
      if (!preset) return;
      if (!confirm(this.p.lang === 'en'
        ? 'Apply preset "' + preset.name_en + '"? Current breakdowns and custom items will be replaced.'
        : '프리셋 "' + preset.name_ko + '"을 적용할까요? 현재 분해·커스텀 항목이 모두 대체됩니다.')) return;
      this.breakdowns = preset.apply(this.p);
      this.saveBreakdowns();
      this.recompute();
    },

    exportBreakdowns() {
      const blob = new Blob([JSON.stringify(this.breakdowns, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gigaette_breakdowns_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
    importBreakdowns(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (typeof data !== 'object') throw new Error('invalid format');
          this.breakdowns = data;
          this.saveBreakdowns();
          this.recompute();
        } catch (err) {
          alert((this.p.lang === 'en' ? 'Import failed: ' : '가져오기 실패: ') + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    },

    openTutorial() {
      this.tutorialOpen = true;
      this.tutorialTab = 0;
    },
    closeTutorial() {
      this.tutorialOpen = false;
      if (this.tutorialSkip) {
        try { localStorage.setItem('gigaette_heatingsim_v2_tut_seen', '1'); } catch (e) {}
      }
    },
    tutorialContent() {
      return (this.p.lang === 'en' ? TUTORIAL_EN : TUTORIAL_KO)[this.tutorialTab] || '';
    },

    // ===== Translation helpers / 번역 헬퍼 =====
    t(key) {
      const lang = this.p.lang || 'ko';
      return TRANSLATIONS[lang][key] || TRANSLATIONS.ko[key] || key;
    },
    param(key) { return PARAM_DEFS[key]; },
    paramLabel(key) {
      const def = PARAM_DEFS[key];
      const lang = this.p.lang || 'ko';
      return def['label_' + lang] || def.label_ko;
    },
    presetName(preset) {
      return preset['name_' + (this.p.lang || 'ko')] || preset.name_ko;
    },
    kpiTechName() {
      const k = this.p.kpiTech || 'isotes';
      return this.t('kpiTech' + k.charAt(0).toUpperCase() + k.slice(1));
    },
    presetDesc(preset) {
      return preset['desc_' + (this.p.lang || 'ko')] || preset.desc_ko;
    },
    setLang(lang) {
      this.p.lang = lang;
      document.documentElement.setAttribute('lang', lang);
      this.updateCharts();   // 차트 라벨 즉시 재렌더 (다음 슬라이더 입력 대기 X)
      if (this.testMode) this.runVerification();
    },

    toggleTestMode() {
      this.testMode = !this.testMode;
      if (this.testMode) {
        this.runVerification();
      } else {
        this.testResults = [];
      }
    },

    // ===== Mode / 모드 =====
    setMode(mode) {
      this.p.mode = mode;
      if (mode === 'poc') this.p.target_cap = 1.5;
      else if (mode === 'scale' && this.p.target_cap < 10) this.p.target_cap = 100;
      this.recompute();
    },
    modeLabel() { return this.p.mode === 'poc' ? this.t('pocLabel') : this.t('scaleLabel'); },
    modeBadge() { return this.p.mode === 'poc' ? this.t('pocBadge') : this.t('scaleBadge'); },
    modeBtnStyle(mode) {
      const active = this.p.mode === mode;
      return `flex:1; padding:6px; font-size:11px; cursor:pointer; border:1px solid ${active ? 'var(--accent)' : 'var(--border)'}; background:${active ? 'var(--accent)' : 'var(--panel)'}; color:${active ? 'white' : 'var(--ink)'};`;
    },
    currentCapacity() { return this.p.mode === 'poc' ? 1.5 : this.p.target_cap; },

    // ===== Presets / 프리셋 =====
    applyPreset(idx) {
      this.activePreset = idx;
      // Reset to defaults, then apply preset's changes (lang·ccy·kpiTech은 사용자 선택 보존)
      const lang = this.p.lang, ccy = this.p.ccy, kpiTech = this.p.kpiTech || 'isotes';
      for (const [k, def] of Object.entries(PARAM_DEFS)) this.p[k] = def.default;
      this.p.mode = 'poc';
      this.p.lang = lang;
      this.p.ccy = ccy;
      this.p.kpiTech = kpiTech;
      this.p.carbon_on = false;
      Object.assign(this.p, PRESETS[idx].changes);
      if (this.p.mode === 'poc') this.p.target_cap = 1.5;
      this.recompute();
    },
    resetAll() { this.applyPreset(0); },

    // ===== Recompute / 재계산 =====
    recompute() {
      // 50ms debounce — Chart.js update overhead 보호. 튜토리얼 문서와 동기화.
      if (this._debounce) clearTimeout(this._debounce);
      this._debounce = setTimeout(() => {
        this.r = compute(this.p, this.breakdowns);
        this.updateCharts();
      }, 50);
    },

    // ===== Formatters / 포맷터 =====
    fmt(v) {
      if (!Number.isFinite(v)) return '—';
      const sym = this.p.ccy === 'USD' ? '$' : this.p.ccy === 'MNT' ? '₮' : '₩';
      const av = Math.abs(v);
      let s;
      if (av >= 1e9) s = (v/1e9).toFixed(2) + 'B';
      else if (av >= 1e6) s = (v/1e6).toFixed(2) + 'M';
      else if (av >= 1e3) s = (v/1e3).toFixed(1) + 'K';
      else s = v.toFixed(0);
      return sym + s;
    },
    fmtSigned(v) {
      if (!Number.isFinite(v)) return '—';
      const sym = this.p.ccy === 'USD' ? '$' : this.p.ccy === 'MNT' ? '₮' : '₩';
      const sign = v >= 0 ? '+' : '−';
      const av = Math.abs(v);
      let s;
      if (av >= 1e9) s = (av/1e9).toFixed(2) + 'B';
      else if (av >= 1e6) s = (av/1e6).toFixed(2) + 'M';
      else if (av >= 1e3) s = (av/1e3).toFixed(1) + 'K';
      else s = av.toFixed(0);
      return sign + sym + s;
    },
    fmtPerMWh(v) {
      if (!Number.isFinite(v)) return '—';
      const sym = this.p.ccy === 'USD' ? '$' : this.p.ccy === 'MNT' ? '₮' : '₩';
      return sym + v.toFixed(1) + '/MWh';
    },
    fmtPayback(v) {
      if (!Number.isFinite(v) || v > 50) return this.t('over50');
      return v.toFixed(1) + ' ' + this.t('years');
    },
    formatMWh(v) { return v >= 100 ? v.toFixed(0) + ' MWh' : v.toFixed(1) + ' MWh'; },

    // ===== Charts / 차트 =====
    // CHART_INSTANCES (모듈 레벨)에 저장해 Alpine Proxy 회피.
    // 옵션은 매번 fresh 객체를 만들어 Chart.js의 내부 mutate가 다른 차트에 전파되지 않도록 격리.
    initCharts() {
      try {
        const colors = { coal: '#d55e00', isotes: '#0072b2', pv: '#e6c200', etc: '#009e73' };
        const techColors = [colors.coal, colors.isotes, colors.pv, colors.etc];
        const altColors  = [colors.isotes, colors.pv, colors.etc];
        const techLabels = [this.t('coal'), this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];
        const altLabels  = [this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];

        // 팩토리: 매 호출마다 새로운 옵션 객체 (Chart.js mutate로부터 격리)
        const makeOpts = (horizontal) => ({
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          indexAxis: horizontal ? 'y' : 'x',
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            y: { ticks: { font: { size: 10 } } },
            x: { ticks: { font: { size: 10 } } }
          }
        });
        const r = this.r;

        const lcohEl = document.getElementById('lcohChart');
        const npvEl  = document.getElementById('npvChart');
        const costEl = document.getElementById('costChart');
        const co2El  = document.getElementById('co2Chart');
        if (!lcohEl || !npvEl || !costEl || !co2El) {
          console.error('[GIGAette] Chart canvas elements not found in DOM');
          return;
        }

        // 기존 인스턴스가 있으면 destroy (재초기화 시 메모리 누수 방지)
        for (const k of Object.keys(CHART_INSTANCES)) {
          try { CHART_INSTANCES[k].destroy(); } catch (e) {}
          delete CHART_INSTANCES[k];
        }

        CHART_INSTANCES.lcoh = new Chart(lcohEl, {
          type: 'bar',
          data: { labels: techLabels,
                  datasets: [{ label: 'LCOH', data: [r.lcoh.coal||0, r.lcoh.isotes||0, r.lcoh.pv||0, r.lcoh.etc||0],
                               backgroundColor: techColors }] },
          options: makeOpts(true)
        });
        CHART_INSTANCES.npv = new Chart(npvEl, {
          type: 'bar',
          data: { labels: altLabels,
                  datasets: [{ label: 'NPV', data: [r.npv.isotes||0, r.npv.pv||0, r.npv.etc||0],
                               backgroundColor: altColors }] },
          options: makeOpts(true)
        });
        CHART_INSTANCES.cost = new Chart(costEl, {
          type: 'bar',
          data: { labels: techLabels,
                  datasets: [{ label: 'Cost', data: [r.net.coal||0, r.net.isotes||0, r.net.pv||0, r.net.etc||0],
                               backgroundColor: techColors }] },
          options: makeOpts(false)
        });
        CHART_INSTANCES.co2 = new Chart(co2El, {
          type: 'bar',
          data: { labels: altLabels,
                  datasets: [{ label: 'CO2 saved (tCO2/yr)',
                               data: [r.co2.isotes||0, r.co2.pv||0, r.co2.etc||0],
                               backgroundColor: altColors }] },
          options: makeOpts(true)
        });

        this.chartsReady = true;
        console.log('[GIGAette] Charts initialized successfully');
      } catch (e) {
        console.error('[GIGAette] Chart init failed:', e);
      }
    },

    updateCharts() {
      if (!this.chartsReady || !CHART_INSTANCES.lcoh) return;
      try {
        const r = this.r;
        // Update labels (언어 토글 즉시 반영)
        const techLabels = [this.t('coal'), this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];
        const altLabels  = [this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];

        CHART_INSTANCES.lcoh.data.labels = techLabels;
        CHART_INSTANCES.lcoh.data.datasets[0].data = [r.lcoh.coal||0, r.lcoh.isotes||0, r.lcoh.pv||0, r.lcoh.etc||0];

        CHART_INSTANCES.npv.data.labels = altLabels;
        CHART_INSTANCES.npv.data.datasets[0].data = [r.npv.isotes||0, r.npv.pv||0, r.npv.etc||0];

        CHART_INSTANCES.cost.data.labels = techLabels;
        CHART_INSTANCES.cost.data.datasets[0].data = [r.net.coal||0, r.net.isotes||0, r.net.pv||0, r.net.etc||0];

        CHART_INSTANCES.co2.data.labels = altLabels;
        CHART_INSTANCES.co2.data.datasets[0].data = [r.co2.isotes||0, r.co2.pv||0, r.co2.etc||0];

        CHART_INSTANCES.lcoh.update('none');
        CHART_INSTANCES.npv.update('none');
        CHART_INSTANCES.cost.update('none');
        CHART_INSTANCES.co2.update('none');
      } catch (e) {
        console.error('[GIGAette] Chart update failed:', e);
      }
    },

    // ===== Verification / 검증 =====
    runVerification() {
      const rows = [];
      const lang = this.p.lang || 'ko';
      for (const t of EXPECTED) {
        const p = {};
        for (const [k, def] of Object.entries(PARAM_DEFS)) p[k] = def.default;
        p.mode = 'poc'; p.ccy = 'USD'; p.carbon_on = false;
        Object.assign(p, t.p);
        if (p.mode === 'poc') p.target_cap = 1.5;
        const out = compute(p, {});   // 검증은 항상 분해 OFF 상태로 (기준값 검증)
        const checks = [
          ['Coal annual / 갈탄 연비용',     out.net.coal,    t.expect.coalAnn],
          ['IsoTES net / IsoTES 순비용', out.net.isotes,  t.expect.isotesNet],
          ['PV net / PV 순비용',         out.net.pv,      t.expect.pvNet],
          ['ETC net / ETC 순비용',       out.net.etc,     t.expect.etcNet],
        ];
        for (const [metric, actual, expected] of checks) {
          if (expected === undefined || expected === null) continue;
          const err = expected === 0 ? Math.abs(actual) : Math.abs((actual - expected) / expected * 100);
          rows.push({
            id: t.id + '_' + metric,
            scenario: t['scenario_' + lang] || t.scenario_ko,
            metric, expected, actual, error: err,
            pass: err < 5.0,
          });
        }
      }
      this.testResults = rows;
    },
  };
}
</script>

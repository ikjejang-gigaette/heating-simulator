<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIGAette Mongolia Heating Simulator / 몽골 난방 사업성 시뮬레이터</title>
<!-- 모델 SSoT: build_model.py / heating_business_model_v1.xlsx v1.3 -->
<!-- 오프라인 사용 시: CDN 두 줄을 같은 폴더에 다운로드 후 src 경로 변경 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1e2530;
    --muted: #6b7785;
    --border: #e3e6ea;
    --accent: #2156a5;
    --accent-soft: #e8f0fb;
    --good: #2e8540;
    --bad: #c0392b;
    --warn: #b07b00;
    /* Okabe-Ito palette */
    --c-coal: #d55e00;
    --c-isotes: #0072b2;
    --c-pv:    #e6c200;
    --c-etc:   #009e73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
  }
  [x-cloak] { display: none !important; }
  header.app {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header.app h1 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.2; }
  header.app h1 .sub { font-size: 11px; color: var(--muted); font-weight: 500; display: block; }
  header.app .badge {
    font-size: 11px; padding: 2px 6px;
    background: var(--accent-soft); color: var(--accent); border-radius: 4px;
  }
  header.app .spacer { flex: 1; }
  header.app .toggle-group { display: flex; gap: 4px; }
  header.app .toggle-group button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    font-size: 11px;
  }
  header.app .toggle-group button.on {
    background: var(--accent); color: white; border-color: var(--accent);
  }
  header.app .action-btn {
    padding: 4px 12px;
    background: var(--accent); color: white;
    border: none; cursor: pointer; border-radius: 4px;
    font-size: 11px;
  }
  header.app .action-btn.secondary { background: var(--muted); }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr 250px;
    gap: 12px;
    padding: 12px;
    min-height: calc(100vh - 90px);
  }
  @media (max-width: 1200px) {
    .layout { grid-template-columns: 300px 1fr; }
    .layout > .presets { grid-column: 1 / -1; order: 3; max-height: 240px; }
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
  aside.params, section.results, aside.presets {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }
  aside.params { max-height: calc(100vh - 110px); overflow-y: auto; }
  aside.presets { max-height: calc(100vh - 110px); overflow-y: auto; }
  .group-title {
    font-weight: 700;
    font-size: 11px;
    color: var(--muted);
    margin: 12px 0 6px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .group-title:first-child { margin-top: 0; }
  details { margin-bottom: 8px; }
  details > summary { cursor: pointer; outline: none; user-select: none; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '▸ '; color: var(--muted); }
  details[open] summary::before { content: '▾ '; }
  .slider-row {
    display: grid;
    grid-template-columns: 1fr 64px;
    gap: 6px;
    align-items: center;
    padding: 4px 0;
  }
  .slider-row label {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; gap: 6px;
    font-size: 11px;
    color: var(--ink);
    font-weight: 500;
  }
  .slider-row label .unit { color: var(--muted); font-weight: normal; }
  .slider-row label .cell-ref { color: #a0a0a0; font-size: 9px; font-weight: normal; }
  .slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider-row input[type=number] {
    width: 64px;
    padding: 2px 4px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 3px;
    text-align: right;
  }
  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0;
    font-size: 11px;
    font-weight: 500;
  }
  .toggle-row input[type=checkbox] { transform: scale(1.2); }

  .meta-bar {
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 6px 10px;
    margin-bottom: 10px;
    font-size: 11px;
    color: var(--accent);
    display: flex; flex-wrap: wrap; gap: 12px;
  }
  .meta-bar strong { color: var(--ink); }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--c-isotes);
    border-radius: 5px;
    padding: 10px;
  }
  .kpi .kpi-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .kpi .kpi-value { font-size: 18px; font-weight: 700; color: var(--ink); }
  .kpi .kpi-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .kpi.good .kpi-value { color: var(--good); }
  .kpi.bad .kpi-value { color: var(--bad); }

  .results-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 12px;
  }
  .results-table th, .results-table td {
    padding: 5px 8px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  .results-table th:first-child, .results-table td:first-child {
    text-align: left; color: var(--muted); font-weight: 500;
  }
  .results-table thead th {
    background: var(--bg);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--muted);
  }
  .results-table thead th.coal { color: var(--c-coal); }
  .results-table thead th.isotes { color: var(--c-isotes); }
  .results-table thead th.pv { color: #b0a020; }
  .results-table thead th.etc { color: var(--c-etc); }
  .results-table .pos { color: var(--good); }
  .results-table .neg { color: var(--bad); }
  .results-table strong { color: var(--ink); }

  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px;
  }
  .chart-card h3 {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .chart-canvas-wrap { position: relative; height: 220px; }

  .preset-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 8px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .preset-item:hover { background: var(--accent-soft); border-color: var(--accent); }
  .preset-item .preset-name { font-weight: 600; display: block; }
  .preset-item .preset-desc { font-size: 10px; color: var(--muted); }
  .preset-item.active { background: var(--accent); color: white; }
  .preset-item.active .preset-desc { color: #d4e3f7; }

  footer.app {
    padding: 8px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer.app code { background: var(--bg); padding: 0 4px; border-radius: 2px; }
  footer.app a { color: var(--accent); }

  .verify-banner {
    background: var(--warn);
    color: white;
    padding: 8px 16px;
    text-align: center;
    font-size: 12px;
  }
  .verify-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 11px;
  }
  .verify-table th, .verify-table td {
    padding: 4px 8px;
    border: 1px solid var(--border);
    text-align: right;
  }
  .verify-table th:first-child, .verify-table td:first-child { text-align: left; }
  .verify-table .pass { background: #e6f4ea; color: var(--good); font-weight: 600; }
  .verify-table .fail { background: #fce8e6; color: var(--bad); font-weight: 600; }

  /* Tutorial modal / 튜토리얼 모달 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 30, 50, 0.6);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--panel);
    border-radius: 8px;
    max-width: 900px;
    width: 100%;
    max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .modal-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-header h2 { margin: 0; font-size: 16px; flex: 1; }
  .modal-header .modal-close {
    background: none; border: none; cursor: pointer; font-size: 20px;
    color: var(--muted); padding: 0 6px;
  }
  .modal-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .modal-tabs button {
    padding: 8px 14px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .modal-tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .modal-body {
    padding: 16px 24px;
    overflow-y: auto;
    flex: 1;
    font-size: 13px;
    line-height: 1.6;
  }
  .modal-body h3 { margin: 16px 0 8px; font-size: 14px; color: var(--accent); }
  .modal-body h3:first-child { margin-top: 0; }
  .modal-body ul, .modal-body ol { padding-left: 22px; margin: 6px 0; }
  .modal-body li { margin-bottom: 4px; }
  .modal-body kbd {
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: monospace;
    font-size: 11px;
  }
  .modal-body .tip {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    margin: 10px 0;
    border-radius: 3px;
    font-size: 12px;
  }
  .modal-body .warn {
    background: #fff8e6;
    border-left: 3px solid var(--warn);
    padding: 8px 12px;
    margin: 10px 0;
    border-radius: 3px;
    font-size: 12px;
  }
  .modal-body table {
    width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px;
  }
  .modal-body table th, .modal-body table td {
    padding: 5px 8px; border: 1px solid var(--border); text-align: left;
  }
  .modal-body table th { background: var(--bg); }
  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: space-between; align-items: center;
  }
  .modal-footer .skip-check { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .modal-footer .btn-group { display: flex; gap: 8px; }
  .modal-footer button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
  }
  .modal-footer button.primary {
    background: var(--accent); color: white; border-color: var(--accent);
  }

  @media print {
    body { background: white; }
    header.app .toggle-group, header.app .action-btn,
    aside.params, aside.presets, footer.app, .modal-overlay { display: none !important; }
    .layout { grid-template-columns: 1fr; padding: 0; min-height: auto; }
    section.results { border: none; padding: 0; }
    .kpi, .chart-card { break-inside: avoid; page-break-inside: avoid; }
    .chart-canvas-wrap { height: 180px; }
  }
</style>
</head>
<body>

<div x-data="simulator()" x-init="init()" x-cloak>

  <!-- ============ Header / 헤더 ============ -->
  <header class="app">
    <h1>
      <span x-text="t('title')"></span>
      <span class="sub" x-text="t('subtitle')"></span>
    </h1>
    <span class="badge">v2.0 · Model v1.3</span>

    <div class="spacer"></div>

    <!-- Language toggle / 언어 토글 -->
    <div class="toggle-group">
      <button :class="{on: p.lang==='ko'}" @click="setLang('ko')">한국어</button>
      <button :class="{on: p.lang==='en'}" @click="setLang('en')">English</button>
    </div>

    <!-- Currency toggle / 통화 -->
    <div class="toggle-group">
      <button :class="{on: p.ccy==='USD'}" @click="p.ccy='USD'; recompute()">USD $</button>
      <button :class="{on: p.ccy==='MNT'}" @click="p.ccy='MNT'; recompute()">MNT ₮</button>
      <button :class="{on: p.ccy==='KRW'}" @click="p.ccy='KRW'; recompute()">KRW ₩</button>
    </div>

    <button class="action-btn" @click="openTutorial()" x-text="'📖 ' + t('tutorial')"></button>
    <button class="action-btn"
            :style="testMode ? 'background:var(--warn)' : 'background:var(--muted)'"
            @click="toggleTestMode()"
            x-text="(testMode ? '✓ ' : '🔬 ') + t('verifyBtn')"
            :title="t('verifyBtnTip')"></button>
    <button class="action-btn" @click="window.print()" x-text="'📄 ' + t('print')"></button>
    <button class="action-btn secondary" @click="resetAll()" x-text="'↺ ' + t('reset')"></button>
  </header>

  <!-- Verification banner / 검증 배너 -->
  <template x-if="testMode">
    <div class="verify-banner" x-text="t('verifyBanner')"></div>
  </template>

  <div class="layout">

    <!-- ============ Left: Parameters / 좌: 파라미터 ============ -->
    <aside class="params">

      <div class="group-title">
        <span x-text="t('mode')"></span>
        <span style="font-size: 9px; font-weight: normal;" x-text="modeBadge()"></span>
      </div>
      <div style="display:flex; gap:4px; margin-bottom:8px;">
        <button @click="setMode('poc')" :style="modeBtnStyle('poc')">
          <span x-text="t('poc')"></span><br><small>1.5 MWh</small>
        </button>
        <button @click="setMode('scale')" :style="modeBtnStyle('scale')">
          <span x-text="t('scale')"></span><br><small>50~500 MWh</small>
        </button>
      </div>

      <div class="group-title"><span x-text="t('tier1')"></span></div>
      <template x-for="key in tier1Keys" :key="key">
        <div class="slider-row" x-show="key !== 'target_cap' || p.mode === 'scale'">
          <label>
            <span x-text="paramLabel(key)"></span>
            <span class="unit" x-text="param(key).unit ? '('+param(key).unit+')' : ''"></span>
          </label>
          <input type="range"
                 :min="param(key).min" :max="param(key).max" :step="param(key).step"
                 x-model.number="p[key]" @input="recompute()">
          <input type="number"
                 :min="param(key).min" :max="param(key).max" :step="param(key).step"
                 x-model.number="p[key]" @change="recompute()">
        </div>
      </template>

      <div class="toggle-row">
        <span x-text="t('carbonInclude')"></span>
        <input type="checkbox" x-model="p.carbon_on" @change="recompute()">
      </div>

      <details>
        <summary class="group-title" style="margin-top:12px;"><span x-text="t('tier2')"></span></summary>
        <template x-for="key in tier2Keys" :key="key">
          <div class="slider-row">
            <label>
              <span x-text="paramLabel(key)"></span>
              <span class="unit" x-text="param(key).unit ? '('+param(key).unit+')' : ''"></span>
            </label>
            <input type="range"
                   :min="param(key).min" :max="param(key).max" :step="param(key).step"
                   x-model.number="p[key]" @input="recompute()">
            <input type="number"
                   :min="param(key).min" :max="param(key).max" :step="param(key).step"
                   x-model.number="p[key]" @change="recompute()">
          </div>
        </template>
      </details>

      <details>
        <summary class="group-title" style="margin-top:12px;"><span x-text="t('tier3')"></span></summary>
        <template x-for="key in tier3Keys" :key="key">
          <div class="slider-row">
            <label>
              <span x-text="paramLabel(key)"></span>
              <span class="unit" x-text="param(key).unit ? '('+param(key).unit+')' : ''"></span>
              <span class="cell-ref" x-text="param(key).cell || ''"></span>
            </label>
            <input type="range"
                   :min="param(key).min" :max="param(key).max" :step="param(key).step"
                   x-model.number="p[key]" @input="recompute()">
            <input type="number"
                   :min="param(key).min" :max="param(key).max" :step="param(key).step"
                   x-model.number="p[key]" @change="recompute()">
          </div>
        </template>
      </details>
    </aside>

    <!-- ============ Center: Results / 중: 결과 ============ -->
    <section class="results">

      <!-- Meta bar / 메타 바 -->
      <div class="meta-bar">
        <span><strong x-text="modeLabel()"></strong></span>
        <span x-text="t('capacity') + ':'"></span><strong x-text="formatMWh(currentCapacity())"></strong>
        <span x-text="t('heatingDays') + ':'"></span><strong x-text="p.heating_days + (p.lang==='ko'?'일':' days')"></strong>
        <span x-text="t('lifetimeMeta') + ':'"></span><strong x-text="p.lifetime + (p.lang==='ko'?'년':' yr')"></strong>
        <span x-text="t('discount') + ':'"></span><strong x-text="(p.discount*100).toFixed(1) + '%'"></strong>
        <span x-text="t('carbon') + ':'"></span><strong x-text="p.carbon_on ? '$'+p.carbon_price+'/tCO₂' : t('carbonOff')"></strong>
      </div>

      <!-- KPI cards / KPI 카드 -->
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-label" x-text="t('kpiCapex')"></div>
          <div class="kpi-value" x-text="fmt(r.capex.isotes)"></div>
          <div class="kpi-sub" x-text="t('coalDiff') + ' +' + fmt(r.capex.isotes - r.capex.coal)"></div>
        </div>
        <div class="kpi" :class="r.npv.isotes >= 0 ? 'good' : 'bad'">
          <div class="kpi-label" x-text="t('kpiNpv')"></div>
          <div class="kpi-value" x-text="fmtSigned(r.npv.isotes)"></div>
          <div class="kpi-sub" x-text="t('discountRef') + ' ' + (p.discount*100).toFixed(1) + '%'"></div>
        </div>
        <div class="kpi">
          <div class="kpi-label" x-text="t('kpiLcoh')"></div>
          <div class="kpi-value" x-text="fmtPerMWh(r.lcoh.isotes)"></div>
          <div class="kpi-sub" x-text="t('coalLcohRef') + ' ' + fmtPerMWh(r.lcoh.coal)"></div>
        </div>
        <div class="kpi" :class="r.payback.isotes < p.lifetime ? 'good' : 'bad'">
          <div class="kpi-label" x-text="t('kpiPayback')"></div>
          <div class="kpi-value" x-text="fmtPayback(r.payback.isotes)"></div>
          <div class="kpi-sub" x-text="t('lifetimeRef') + ' ' + p.lifetime + (p.lang==='ko'?'년':' yr')"></div>
        </div>
      </div>

      <!-- 4-tech comparison table / 4기술 비교 표 -->
      <table class="results-table">
        <thead>
          <tr>
            <th x-text="t('metric')"></th>
            <th class="coal" x-text="t('coal')"></th>
            <th class="isotes" x-text="t('isotesGrid')"></th>
            <th class="pv" x-text="t('pvIsotes')"></th>
            <th class="etc" x-text="t('etcIsotes')"></th>
          </tr>
        </thead>
        <tbody>
          <tr><td x-text="t('rowCapex')"></td>
            <td x-text="fmt(r.capex.coal)"></td>
            <td x-text="fmt(r.capex.isotes)"></td>
            <td x-text="fmt(r.capex.pv)"></td>
            <td x-text="fmt(r.capex.etc)"></td></tr>
          <tr><td x-text="t('rowGross')"></td>
            <td x-text="fmt(r.gross.coal)"></td>
            <td x-text="fmt(r.gross.isotes)"></td>
            <td x-text="fmt(r.gross.pv)"></td>
            <td x-text="fmt(r.gross.etc)"></td></tr>
          <tr><td x-text="t('rowCredit')"></td>
            <td>—</td>
            <td x-text="fmt(r.credit.isotes)" :class="r.credit.isotes>0?'pos':''"></td>
            <td x-text="fmt(r.credit.pv)" :class="r.credit.pv>0?'pos':''"></td>

// ============================================================
// Core computation / 핵심 계산
// ============================================================
function compute(p) {
  const fx = p.ccy === 'USD' ? 1 : p.ccy === 'MNT' ? p.fx_usd_mnt : p.fx_usd_krw;
  const scale = p.mode === 'scale' ? (p.target_cap / 1.5) : 1.0;

  const annualMJ   = p.daily_mj * p.heating_days * scale;
  const annualMWh  = annualMJ / 3600;
  const elecKwhYr  = (p.daily_mj / 3.6) / p.elec_eff * p.heating_days * scale;
  const coalTonYr  = annualMJ / p.coal_eff / p.coal_hhv / 1000;

  const coalLow_mnt  = p.coal_low_mnt  * p.coal_price_mult;
  const coalHigh_mnt = p.coal_high_mnt * p.coal_price_mult;
  const coalFuelUsd  = coalTonYr * (coalLow_mnt + coalHigh_mnt) / 2 / p.fx_usd_mnt;
  const transportUsd = p.transport_usd * p.trips_yr * scale;
  const coalMaintUsd = p.coal_only * 0.04 * scale;
  const coalAnnUsd   = coalFuelUsd + transportUsd + coalMaintUsd;

  const capexCoalUsd = (p.common_infra + p.coal_only) * Math.pow(scale, p.scale_exp);
  const capexIsotesBaseUsd = (p.capex_system_krw + p.capex_logistics_krw + p.capex_install_krw) / p.fx_usd_krw;
  const capexIsotesUsd = capexIsotesBaseUsd * Math.pow(scale, p.scale_exp);

  const pvKwp = (p.daily_mj / 3.6) / p.elec_eff / p.solar_irrad * scale;
  const capexPvAddUsd = pvKwp * 1000 * (p.pv_module + p.pv_inverter + p.pv_install);
  const capexPvUsd = capexIsotesUsd + capexPvAddUsd;

  const etcM2 = (p.daily_mj / 3.6) / p.elec_eff / p.solar_irrad / p.etc_eff * scale;
  const capexEtcAddUsd = etcM2 * (p.etc_tube + p.etc_mount + p.etc_circuit);
  const capexEtcUsd = capexIsotesUsd + capexEtcAddUsd;

  const elecRateDisc = p.night_rate_mnt * (1 - p.night_disc) / p.fx_usd_mnt;
  const elecRateFull = p.night_rate_mnt / p.fx_usd_mnt;
  const isotesAnnUsd = elecKwhYr * elecRateDisc + capexIsotesUsd * p.opex_pct;
  const pvAnnUsd  = elecKwhYr * (1 - p.pv_cover)  * elecRateFull + capexPvUsd  * p.opex_pct;
  const etcAnnUsd = elecKwhYr * (1 - p.etc_cover) * elecRateFull + capexEtcUsd * p.opex_pct;

  const coalCo2 = coalTonYr * 2.36;
  const gridCo2 = elecKwhYr * p.grid_co2 / 1000;
  const co2Isotes = coalCo2 - gridCo2;
  const co2Pv     = coalCo2 - (1 - p.pv_cover)  * gridCo2;
  const co2Etc    = coalCo2 - (1 - p.etc_cover) * gridCo2;

  const carbonMult = p.carbon_on ? p.carbon_price : 0;
  const creditIsotes = co2Isotes * carbonMult;
  const creditPv     = co2Pv     * carbonMult;
  const creditEtc    = co2Etc    * carbonMult;

  const netCoal   = coalAnnUsd;
  const netIsotes = isotesAnnUsd - creditIsotes;
  const netPv     = pvAnnUsd     - creditPv;
  const netEtc    = etcAnnUsd    - creditEtc;

  const r = p.discount, n = p.lifetime;
  const PVF = (1 - Math.pow(1 + r, -n)) / r;

  const lcoh = (cap, ann) => safeFinite((cap + PVF * ann) / (PVF * annualMWh) * fx);
  const payback = (capDiff, save) => save > 0 ? capDiff / save : Infinity;
  const npv = (capDiff, save) => save * PVF - capDiff;

  return {
    annualMWh, coalTonYr, elecKwhYr, pvKwp, etcM2,
    capex: { coal: capexCoalUsd*fx, isotes: capexIsotesUsd*fx, pv: capexPvUsd*fx, etc: capexEtcUsd*fx },
    gross: { coal: coalAnnUsd*fx, isotes: isotesAnnUsd*fx, pv: pvAnnUsd*fx, etc: etcAnnUsd*fx },
    credit: { coal: 0, isotes: creditIsotes*fx, pv: creditPv*fx, etc: creditEtc*fx },
    net:   { coal: netCoal*fx, isotes: netIsotes*fx, pv: netPv*fx, etc: netEtc*fx },
    lcoh:  { coal: lcoh(capexCoalUsd, netCoal), isotes: lcoh(capexIsotesUsd, netIsotes),
             pv: lcoh(capexPvUsd, netPv), etc: lcoh(capexEtcUsd, netEtc) },
    payback: { isotes: payback(capexIsotesUsd - capexCoalUsd, netCoal - netIsotes),
               pv:     payback(capexPvUsd     - capexCoalUsd, netCoal - netPv),
               etc:    payback(capexEtcUsd    - capexCoalUsd, netCoal - netEtc) },
    npv: { isotes: npv(capexIsotesUsd - capexCoalUsd, netCoal - netIsotes) * fx,
           pv:     npv(capexPvUsd     - capexCoalUsd, netCoal - netPv)     * fx,
           etc:    npv(capexEtcUsd    - capexCoalUsd, netCoal - netEtc)    * fx },
    co2: { coal: coalCo2, isotes: co2Isotes, pv: co2Pv, etc: co2Etc },
  };
}
function safeFinite(v) { return Number.isFinite(v) ? v : 0; }

      isotesNet:  10062,    // electricity (50% disc) + IsoTES maint
      pvNet:      12181,    // PV backup (30%) + (PV+IsoTES) maint
      etcNet:     4337,     // ETC maint only (100% solar coverage)
    }
  },
  {
    id: 's_carbon50', scenario_ko: 'S2: 탄소 $50/t', scenario_en: 'S2: Carbon $50/t',
    p: { mode: 'poc', night_disc: 0.50, carbon_on: true, carbon_price: 50, target_cap: 1.5 },
    // ISO credit  = (458.78 - 179.05) × 50 = 13,987;   net = 10,062 - 13,987 = -3,925
    // ETC credit  = 458.78 × 50           = 22,939;   net = 4,337 - 22,939 = -18,602
    expect: { isotesNet: -3925, etcNet: -18602 }
  },
  {
    id: 's_etc70', scenario_ko: 'S3: ETC 70% 보수', scenario_en: 'S3: ETC 70% conservative',
    p: { mode: 'poc', night_disc: 0.50, carbon_on: false, etc_cover: 0.70, target_cap: 1.5 },
    expect: { etcNet: 8263 }   // 30% backup electricity at full rate + ETC maint
  },
  // === 스케일업 검증 시나리오 (target_cap=100, scale=66.67, b=0.7) ===
  {
    id: 's_scale100', scenario_ko: 'S4: 스케일 100MWh', scenario_en: 'S4: Scale-up 100MWh',
    p: { mode: 'scale', target_cap: 100, scale_exp: 0.7, night_disc: 0.50, carbon_on: false },
    // scale = 66.67; 갈탄 12,960t/yr × MNT-mid + transport 480K + maint 80K = 1,143,200
    // CAPEX_iso = 175,891 × 66.67^0.7 = 3,326,431
    expect: {
      coalAnn:    1143200,
      isotesNet:  502817,
      pvNet:      644091,
      etcNet:     121110,
    }
  },
  {
    id: 's_scale100_c15', scenario_ko: 'S5: 스케일100 + 탄소$15', scenario_en: 'S5: Scale100 + Carbon$15',
    p: { mode: 'scale', target_cap: 100, scale_exp: 0.7, night_disc: 0.50, carbon_on: true, carbon_price: 15 },

// ============================================================
// Non-reactive chart storage (must NOT be inside Alpine data proxy —
// Chart.js 인스턴스를 Proxy로 감싸면 update('none')가 silent failure)
// ============================================================
const CHART_INSTANCES = {};

// ============================================================
// Alpine component
// ============================================================
function simulator() {
  return {
    p: {},
    r: { capex: {}, gross: {}, credit: {}, net: {}, lcoh: {}, payback: {}, npv: {}, co2: {} },
    tier1Keys: [], tier2Keys: [], tier3Keys: [],
    activePreset: 0,
    testMode: false,
    testResults: [],
    chartsReady: false,
    _debounce: null,
    presets: PRESETS,
    tutorialOpen: false,
    tutorialTab: 0,
    tutorialSkip: false,
    tutorialTabs: [
      { key: 'tabQuick' },
      { key: 'tabMode' },
      { key: 'tabSlider' },
      { key: 'tabResults' },
      { key: 'tabPresets' },
      { key: 'tabIO' },
      { key: 'tabFaq' },
    ],

    init() {
      for (const [k, def] of Object.entries(PARAM_DEFS)) this.p[k] = def.default;
      this.p.mode = 'poc';
      this.p.ccy = 'USD';
      this.p.lang = 'ko';
      this.p.carbon_on = false;
      this.tier1Keys = Object.keys(PARAM_DEFS).filter(k => PARAM_DEFS[k].tier === 1);
      this.tier2Keys = Object.keys(PARAM_DEFS).filter(k => PARAM_DEFS[k].tier === 2);
      this.tier3Keys = Object.keys(PARAM_DEFS).filter(k => PARAM_DEFS[k].tier === 3);

      const url = new URL(window.location.href);
      this.testMode = url.searchParams.get('test') === '1';
      const langParam = url.searchParams.get('lang');
      if (langParam === 'en' || langParam === 'ko') {
        this.p.lang = langParam;
        document.documentElement.setAttribute('lang', langParam);
      }

      // 초기 compute는 동기 실행 — 차트가 0으로 깜빡이는 것 방지
      this.r = compute(this.p);
      // Robust chart init: wait for x-cloak removal + first paint + Chart.js ready.
      // setTimeout(0) → next macrotask after Alpine processes x-cloak.
      // requestAnimationFrame → after browser paint (canvas dimensions ready).
      const tryInit = (attempt = 0) => {
        if (typeof Chart === 'undefined') {
          if (attempt < 50) return setTimeout(() => tryInit(attempt + 1), 100);
          console.error('[GIGAette] Chart.js failed to load after 5s');
          return;
        }
        const canvas = document.getElementById('lcohChart');
        if (!canvas || canvas.offsetWidth === 0) {
          if (attempt < 30) return requestAnimationFrame(() => tryInit(attempt + 1));
          console.warn('[GIGAette] Canvas size 0 after 30 RAFs — proceeding anyway');
        }
        this.initCharts();
      };
      setTimeout(() => tryInit(), 0);

      if (this.testMode) this.runVerification();

      // First-visit tutorial / 첫 방문 튜토리얼
      try {
        const seen = localStorage.getItem('gigaette_heatingsim_v2_tut_seen');
        if (!seen) this.openTutorial();
      } catch (e) { /* localStorage blocked (file://): silently skip */ }
    },

    openTutorial() {
      this.tutorialOpen = true;
      this.tutorialTab = 0;
    },
    closeTutorial() {
      this.tutorialOpen = false;
      if (this.tutorialSkip) {
        try { localStorage.setItem('gigaette_heatingsim_v2_tut_seen', '1'); } catch (e) {}
      }
    },
    tutorialContent() {
      return (this.p.lang === 'en' ? TUTORIAL_EN : TUTORIAL_KO)[this.tutorialTab] || '';
    },

    // ===== Translation helpers / 번역 헬퍼 =====
    t(key) {
      const lang = this.p.lang || 'ko';
      return TRANSLATIONS[lang][key] || TRANSLATIONS.ko[key] || key;
    },
    param(key) { return PARAM_DEFS[key]; },
    paramLabel(key) {
      const def = PARAM_DEFS[key];
      const lang = this.p.lang || 'ko';
      return def['label_' + lang] || def.label_ko;
    },
    presetName(preset) {
      return preset['name_' + (this.p.lang || 'ko')] || preset.name_ko;
    },
    presetDesc(preset) {
      return preset['desc_' + (this.p.lang || 'ko')] || preset.desc_ko;
    },
    setLang(lang) {
      this.p.lang = lang;
      document.documentElement.setAttribute('lang', lang);
      this.updateCharts();   // 차트 라벨 즉시 재렌더 (다음 슬라이더 입력 대기 X)
      if (this.testMode) this.runVerification();
    },

    toggleTestMode() {
      this.testMode = !this.testMode;
      if (this.testMode) {
        this.runVerification();
      } else {
        this.testResults = [];
      }
    },

    // ===== Mode / 모드 =====
    setMode(mode) {
      this.p.mode = mode;
      if (mode === 'poc') this.p.target_cap = 1.5;
      else if (mode === 'scale' && this.p.target_cap < 10) this.p.target_cap = 100;
      this.recompute();
    },
    modeLabel() { return this.p.mode === 'poc' ? this.t('pocLabel') : this.t('scaleLabel'); },
    modeBadge() { return this.p.mode === 'poc' ? this.t('pocBadge') : this.t('scaleBadge'); },
    modeBtnStyle(mode) {
      const active = this.p.mode === mode;
      return `flex:1; padding:6px; font-size:11px; cursor:pointer; border:1px solid ${active ? 'var(--accent)' : 'var(--border)'}; background:${active ? 'var(--accent)' : 'var(--panel)'}; color:${active ? 'white' : 'var(--ink)'};`;
    },
    currentCapacity() { return this.p.mode === 'poc' ? 1.5 : this.p.target_cap; },

    // ===== Presets / 프리셋 =====
    applyPreset(idx) {
      this.activePreset = idx;
      // Reset to defaults, then apply preset's changes
      const lang = this.p.lang, ccy = this.p.ccy;
      for (const [k, def] of Object.entries(PARAM_DEFS)) this.p[k] = def.default;
      this.p.mode = 'poc';
      this.p.lang = lang;
      this.p.ccy = ccy;
      this.p.carbon_on = false;
      Object.assign(this.p, PRESETS[idx].changes);
      if (this.p.mode === 'poc') this.p.target_cap = 1.5;
      this.recompute();
    },
    resetAll() { this.applyPreset(0); },

    // ===== Recompute / 재계산 =====
    recompute() {
      // 50ms debounce — Chart.js update overhead 보호. 튜토리얼 문서와 동기화.
      if (this._debounce) clearTimeout(this._debounce);
      this._debounce = setTimeout(() => {
        this.r = compute(this.p);
        this.updateCharts();
      }, 50);
    },

    // ===== Formatters / 포맷터 =====
    fmt(v) {
      if (!Number.isFinite(v)) return '—';
      const sym = this.p.ccy === 'USD' ? '$' : this.p.ccy === 'MNT' ? '₮' : '₩';
      const av = Math.abs(v);
      let s;
      if (av >= 1e9) s = (v/1e9).toFixed(2) + 'B';
      else if (av >= 1e6) s = (v/1e6).toFixed(2) + 'M';
      else if (av >= 1e3) s = (v/1e3).toFixed(1) + 'K';
      else s = v.toFixed(0);
      return sym + s;
    },
    fmtSigned(v) {
      if (!Number.isFinite(v)) return '—';
      const sym = this.p.ccy === 'USD' ? '$' : this.p.ccy === 'MNT' ? '₮' : '₩';
      const sign = v >= 0 ? '+' : '−';
      const av = Math.abs(v);
      let s;
      if (av >= 1e9) s = (av/1e9).toFixed(2) + 'B';
      else if (av >= 1e6) s = (av/1e6).toFixed(2) + 'M';
      else if (av >= 1e3) s = (av/1e3).toFixed(1) + 'K';
      else s = av.toFixed(0);
      return sign + sym + s;
    },
    fmtPerMWh(v) {
      if (!Number.isFinite(v)) return '—';
      const sym = this.p.ccy === 'USD' ? '$' : this.p.ccy === 'MNT' ? '₮' : '₩';
      return sym + v.toFixed(1) + '/MWh';
    },
    fmtPayback(v) {
      if (!Number.isFinite(v) || v > 50) return this.t('over50');
      return v.toFixed(1) + ' ' + this.t('years');
    },
    formatMWh(v) { return v >= 100 ? v.toFixed(0) + ' MWh' : v.toFixed(1) + ' MWh'; },

    // ===== Charts / 차트 =====
    // CHART_INSTANCES (모듈 레벨)에 저장해 Alpine Proxy 회피.
    initCharts() {
      try {
        const colors = { coal: '#d55e00', isotes: '#0072b2', pv: '#e6c200', etc: '#009e73' };
        const techColors = [colors.coal, colors.isotes, colors.pv, colors.etc];
        const altColors  = [colors.isotes, colors.pv, colors.etc];
        const techLabels = [this.t('coal'), this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];
        const altLabels  = [this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];
        const commonOpts = {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: { y: { ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } }
        };
        const r = this.r;

        const lcohEl = document.getElementById('lcohChart');
        const npvEl  = document.getElementById('npvChart');
        const costEl = document.getElementById('costChart');
        const co2El  = document.getElementById('co2Chart');
        if (!lcohEl || !npvEl || !costEl || !co2El) {
          console.error('[GIGAette] Chart canvas elements not found in DOM');
          return;
        }

        // 기존 인스턴스가 있으면 destroy (재초기화 시 메모리 누수 방지)
        for (const k of Object.keys(CHART_INSTANCES)) {
          try { CHART_INSTANCES[k].destroy(); } catch (e) {}
          delete CHART_INSTANCES[k];
        }

        CHART_INSTANCES.lcoh = new Chart(lcohEl, {
          type: 'bar',
          data: { labels: techLabels,
                  datasets: [{ label: 'LCOH', data: [r.lcoh.coal||0, r.lcoh.isotes||0, r.lcoh.pv||0, r.lcoh.etc||0],
                               backgroundColor: techColors }] },
          options: { ...commonOpts, indexAxis: 'y' }
        });
        CHART_INSTANCES.npv = new Chart(npvEl, {
          type: 'bar',
          data: { labels: altLabels,
                  datasets: [{ label: 'NPV', data: [r.npv.isotes||0, r.npv.pv||0, r.npv.etc||0],
                               backgroundColor: altColors }] },
          options: { ...commonOpts, indexAxis: 'y' }
        });
        CHART_INSTANCES.cost = new Chart(costEl, {
          type: 'bar',
          data: { labels: techLabels,
                  datasets: [{ label: 'Cost', data: [r.net.coal||0, r.net.isotes||0, r.net.pv||0, r.net.etc||0],
                               backgroundColor: techColors }] },
          options: commonOpts
        });
        CHART_INSTANCES.co2 = new Chart(co2El, {
          type: 'doughnut',
          data: { labels: altLabels,
                  datasets: [{ data: [r.co2.isotes||0, r.co2.pv||0, r.co2.etc||0], backgroundColor: altColors }] },
          options: { responsive: true, maintainAspectRatio: false, animation: false,
                     plugins: { legend: { position: 'right', labels: { font: { size: 10 } } } } }
        });

        this.chartsReady = true;
        console.log('[GIGAette] Charts initialized successfully');
      } catch (e) {
        console.error('[GIGAette] Chart init failed:', e);
      }
    },

    updateCharts() {
      if (!this.chartsReady || !CHART_INSTANCES.lcoh) return;
      try {
        const r = this.r;
        // Update labels (언어 토글 즉시 반영)
        const techLabels = [this.t('coal'), this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];
        const altLabels  = [this.t('isotesGrid'), this.t('pvIsotes'), this.t('etcIsotes')];

        CHART_INSTANCES.lcoh.data.labels = techLabels;
        CHART_INSTANCES.lcoh.data.datasets[0].data = [r.lcoh.coal||0, r.lcoh.isotes||0, r.lcoh.pv||0, r.lcoh.etc||0];

        CHART_INSTANCES.npv.data.labels = altLabels;
        CHART_INSTANCES.npv.data.datasets[0].data = [r.npv.isotes||0, r.npv.pv||0, r.npv.etc||0];

        CHART_INSTANCES.cost.data.labels = techLabels;
        CHART_INSTANCES.cost.data.datasets[0].data = [r.net.coal||0, r.net.isotes||0, r.net.pv||0, r.net.etc||0];

        CHART_INSTANCES.co2.data.labels = altLabels;
        CHART_INSTANCES.co2.data.datasets[0].data = [r.co2.isotes||0, r.co2.pv||0, r.co2.etc||0];

        CHART_INSTANCES.lcoh.update('none');
        CHART_INSTANCES.npv.update('none');
        CHART_INSTANCES.cost.update('none');
        CHART_INSTANCES.co2.update('none');
      } catch (e) {
        console.error('[GIGAette] Chart update failed:', e);
      }
    },

    // ===== Verification / 검증 =====
    runVerification() {
      const rows = [];
      const lang = this.p.lang || 'ko';
      for (const t of EXPECTED) {
        const p = {};
        for (const [k, def] of Object.entries(PARAM_DEFS)) p[k] = def.default;
        p.mode = 'poc'; p.ccy = 'USD'; p.carbon_on = false;
        Object.assign(p, t.p);
        if (p.mode === 'poc') p.target_cap = 1.5;
        const out = compute(p);
        const checks = [
          ['Coal annual / 갈탄 연비용',     out.net.coal,    t.expect.coalAnn],
          ['IsoTES net / IsoTES 순비용', out.net.isotes,  t.expect.isotesNet],
          ['PV net / PV 순비용',         out.net.pv,      t.expect.pvNet],
          ['ETC net / ETC 순비용',       out.net.etc,     t.expect.etcNet],
        ];
        for (const [metric, actual, expected] of checks) {
          if (expected === undefined || expected === null) continue;
          const err = expected === 0 ? Math.abs(actual) : Math.abs((actual - expected) / expected * 100);
          rows.push({
            id: t.id + '_' + metric,
            scenario: t['scenario_' + lang] || t.scenario_ko,
            metric, expected, actual, error: err,
            pass: err < 5.0,
          });
        }
      }
      this.testResults = rows;
    },
  };
}
</script>
